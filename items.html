<style>
/* Layout: a quartermaster's ledger – tabs (gear / sets / books), filter bar, gear grouped by the level its tier opens */
:root{
  --bg:#120e19; --panel:#1b1525; --panel2:#231b30; --line:#3a2e4c;
  --fg:#e9e2f2; --muted:#a99cba; --gold:#d8b36a; --violet:#b57dff; --leg:#ff9f45; --quest:#7fd1b9;
  --display:"Cinzel","Cormorant SC",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
header.hero{padding-block:28px 20px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{font:inherit;font-size:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
button.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:700}
button.chip.tab{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
button.chip:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.search{flex:1 1 200px;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.lang{margin-left:auto}
.lbl{font-size:13px;color:var(--muted);margin-right:2px}
section.group{padding-top:28px}
.ghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ghead h2{font-family:var(--display);font-size:22px;margin:0;color:var(--gold);letter-spacing:.06em}
.ghead p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
article.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;min-width:0}
article.card.q{border-color:color-mix(in srgb,var(--quest) 45%,var(--line))}
.icon{width:56px;height:56px;border-radius:4px;border:1px solid var(--gold);box-shadow:0 0 0 3px var(--panel2);display:grid;place-items:center;background:var(--panel2)}
.icon svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
img.icon{object-fit:cover}
.main{min-width:0;display:grid;gap:6px;align-content:start}
.title{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.title h3{margin:0;font-family:var(--display);font-size:17px;letter-spacing:.02em}
.badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:3px;padding:1px 7px;font-weight:700;white-space:nowrap}
.badge.lv{color:var(--gold);border:1px solid var(--gold)}
.badge.leg{color:var(--leg);border:1px solid color-mix(in srgb,var(--leg) 60%,transparent)}
.badge.qs{color:var(--bg);background:var(--quest)}
.badge.set{color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 55%,transparent);cursor:pointer;background:none;font-family:inherit}
.kind{font-size:14px;color:var(--muted)}
ul.bon{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 6px}
ul.bon li{font-size:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-variant-numeric:tabular-nums}
.lock,.src{font-size:14px;margin:0;color:var(--fg)}
.lock b,.src b{color:var(--gold);font-weight:500}
.flav{font-size:14px;color:var(--muted);font-style:italic;margin:0}
details.fl summary{font-size:13px;color:var(--muted);cursor:pointer;width:max-content}
.setcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px;min-width:0}
.sethead{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.setcard h3{margin:0;font-family:var(--display);font-size:19px}
.tiers{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tiers li{display:grid;grid-template-columns:2.2em 1fr;gap:8px;font-size:15px}
.tiers li span{font-family:var(--display);color:var(--gold);font-weight:700}
.pieces{font-size:14px;color:var(--muted);margin:0}
.steps{font-size:14px;margin:0;padding-left:1.2em;display:grid;gap:4px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.book{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center}
.book .icon{width:36px;height:36px;box-shadow:none}.book .icon svg{width:22px;height:22px}
.book b{font-weight:500}.book small{display:block;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.note{font-size:14px;color:var(--muted);margin:14px 0 0;max-width:80ch}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
footer p{margin:0}
@media (max-width:640px){.bar{position:static}.lang{margin-left:0}}
@media (max-width:480px){article.card{grid-template-columns:44px 1fr}article.card .icon{width:44px;height:44px}.icon svg{width:28px;height:28px}}
@media (prefers-reduced-motion:no-preference){article.card,.setcard{transition:border-color .15s}article.card:hover,.setcard:hover{border-color:var(--gold)}}
html[lang="ru"] :is(h1,h2,h3,.eyebrow){font-weight:700}
</style>

</div>
<main id="list"></main>
<footer id="foot"></footer>
</div>

лителя. Тьма льнёт к его складкам, словно узнаёт хозяина. Или наследника.","en":"The First Sovereign's cloak. The dark clings to its folds, as if it knows its master. Or his heir."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"+1 Призывание","en":"+1 Summoning"},{"ru":"+2 Память","en":"+2 Memory"},{"ru":"+2 Телосложение","en":"+2 Constitution"},{"ru":"Гнёзд для рун: 1","en":"Rune slots: 1"}],"set":"SOVEREIGN","relic":{"set":"SOVEREIGN","step":2,"ru":"четвёртый осколок памяти отдан торговцу и Оддо отданы все 7 страниц Устава","en":"the fourth shard of memory handed to the merchant and all 7 pages of the Code handed to Oddo"},"source":null,"icon":null},{"id":"ARM_SM_CommanderGloves","order":44,"slot":"hands","kind":"mage","type":"Armor","name":{"ru":"Перчатки полководца","en":"Warlord's Gloves"},"flavour":{"ru":"Перчатки полководца. Жест этих рук понимала вся рать. Даэрон носил левую, правую – тот, кому доверял больше всех.","en":"A warlord's gloves. The whole host understood the gesture of these hands. Daeron wore the left; the right was worn by the one he trusted most."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"+1 Призывание","en":"+1 Summoning"},{"ru":"+2 Лидерство","en":"+2 Leadership"},{"ru":"+1 Память","en":"+1 Memory"}],"set":"SOVEREIGN","relic":{"set":"SOVEREIGN","step":1,"ru":"четвёртый осколок памяти отдан торговцу","en":"the fourth shard of memory handed to the merchant"},"source":null,"icon":null},{"id":"ARM_SM_MonarchLegs","order":45,"slot":"legs","kind":"mage","type":"Armor","name":{"ru":"Поножи Повелителя","en":"Sovereign's Legguards"},"flavour":{"ru":"Поножи Повелителя. Тяжёлая тьма, лёгкая как шёлк: Даэрон не любил стоять на месте.","en":"The Sovereign's greaves. Heavy dark, light as silk: Daeron never liked to stand still."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"+1 Призывание","en":"+1 Summoning"},{"ru":"+1 Телосложение","en":"+1 Constitution"},{"ru":"+1 Память","en":"+1 Memory"}],"set":"SOVEREIGN","relic":{"set":"SOVEREIGN","step":2,"ru":"четвёртый осколок памяти отдан торговцу и Оддо отданы все 7 страниц Устава","en":"the fourth shard of memory handed to the merchant and all 7 pages of the Code handed to Oddo"},"source":null,"icon":null},{"id":"ARM_SM_ShadowStep","order":46,"slot":"feet","kind":"mage","type":"Armor","name":{"ru":"Поступь теней","en":"Shadowstep"},"flavour":{"ru":"Шаги в этих сапогах не оставляют следов – только тени. Так Даэрон пришёл на перевал. Один. На рассвете.","en":"Steps in these boots leave no tracks – only shadows. So Daeron came to the pass. Alone. At dawn."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"+1 Призывание","en":"+1 Summoning"},{"ru":"+1 м перемещения","en":"+1m movement"},{"ru":"+2 Инициатива","en":"+2 Initiative"}],"set":"SOVEREIGN","relic":{"set":"SOVEREIGN","step":2,"ru":"четвёртый осколок памяти отдан торговцу и Оддо отданы все 7 страниц Устава","en":"the fourth shard of memory handed to the merchant and all 7 pages of the Code handed to Oddo"},"source":null,"icon":null},{"id":"WPN_SM_SovereignShield","order":47,"slot":"shield","kind":null,"type":"Shield","name":{"ru":"Эгида Повелителя Теней","en":"Aegis of the Shadow Sovereign"},"flavour":{"ru":"Чёрный щит Даэрона, первого Повелителя. Безмолвная рать собиралась за ним, как за знаменем. В ту ночь у перевала щит был пуст.","en":"The black shield of Daeron, the First Sovereign. The Silent Host gathered behind it as behind a banner. That night at the pass, no one stood behind it."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"+2 Призывание","en":"+2 Summoning"},{"ru":"+1 Память","en":"+1 Memory"},{"ru":"+10% шанс блока","en":"+10% Block chance"}],"set":null,"relic":{"set":"SOVEREIGN","step":1,"ru":"четвёртый осколок памяти отдан торговцу","en":"the fourth shard of memory handed to the merchant"},"source":null,"icon":null},{"id":"WPN_SM_VoidShield","order":48,"slot":"shield","kind":null,"type":"Shield","name":{"ru":"Щит Пустоты","en":"Void Shield"},"flavour":{"ru":"В его чёрной глади отражается не лицо, а бездна. У тени нет Источника – бездне нечего в ней взять.","en":"Its black surface reflects not a face but the abyss. A shadow has no Source – the abyss has nothing to take from it."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"+2 Призывание","en":"+2 Summoning"},{"ru":"+1 Телосложение","en":"+1 Constitution"},{"ru":"+15% магическая броня","en":"+15% Magic Armour"}],"set":null,"relic":null,"source":null,"icon":null},{"id":"WPN_SM_DragonStaff","order":49,"slot":"weapon","kind":"staff","type":"Weapon","name":{"ru":"Посох драконьей ярости","en":"Staff of Draconic Fury"},"flavour":{"ru":"Посох из кости древнего дракона, что отказался служить и Семерым, и Вечным. Даёт навык «Теневой взрыв».","en":"A staff of the bone of an ancient dragon who refused to serve both the Seven and the Eternals. Grants the skill “Shadow Burst”."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"Урон: физический","en":"Damage: physical"},{"ru":"+2 Призывание","en":"+2 Summoning"},{"ru":"+2 Память","en":"+2 Memory"},{"ru":"+2 Телосложение","en":"+2 Constitution"},{"ru":"+25% урон","en":"+25% damage"},{"ru":"Навык «Теневой взрыв»","en":"Skill “Shadow Burst”"},{"ru":"Гнёзд для рун: 1","en":"Rune slots: 1"}],"set":null,"relic":null,"source":null,"icon":null},{"id":"WPN_SM_DragonFang","order":50,"slot":"weapon","kind":"dagger","type":"Weapon","name":{"ru":"Клык древнего дракона","en":"Fang of the Ancient Dragon"},"flavour":{"ru":"Клык дракона, перед которым пали целые армии. Рать не пала: ей было нечем.","en":"The fang of a dragon before which whole armies fell. The host did not fall: it had nothing left to fall with."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"Урон: физический","en":"Damage: physical"},{"ru":"+2 Призывание","en":"+2 Summoning"},{"ru":"+15% шанс крит. удара","en":"+15% Critical Chance"},{"ru":"+20% урон","en":"+20% damage"},{"ru":"Гнёзд для рун: 1","en":"Rune slots: 1"}],"set":null,"relic":null,"source":null,"icon":null},{"id":"WPN_SM_FirstBlade","order":51,"slot":"weapon","kind":"sword","type":"Weapon","name":{"ru":"Клинок первого Повелителя","en":"Blade of the First Sovereign"},"flavour":{"ru":"Меч Даэрона, первого Повелителя Теней. Он узнаёт руку наследника: удар клинком с шансом 25% раскалывает броню врага (−20% физической брони и сопротивления на 2 хода). Даёт навык «Казнь Повелителя».","en":"The sword of Daeron, the first Shadow Sovereign. It knows the hand of its heir: a strike with the blade has a 25% chance to crack the enemy's armour (−20% physical armour and resistance for 2 turns). Grants the skill “Sovereign's Execution”."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"Урон: физический","en":"Damage: physical"},{"ru":"+2 Призывание","en":"+2 Summoning"},{"ru":"+1 Лидерство","en":"+1 Leadership"},{"ru":"+2 Телосложение","en":"+2 Constitution"},{"ru":"+10% урон","en":"+10% damage"},{"ru":"Навык «Казнь Повелителя»","en":"Skill “Sovereign's Execution”"},{"ru":"Гнёзд для рун: 1","en":"Rune slots: 1"}],"set":null,"relic":{"set":"SOVEREIGN","step":2,"ru":"четвёртый осколок памяти отдан торговцу и Оддо отданы все 7 страниц Устава","en":"the fourth shard of memory handed to the merchant and all 7 pages of the Code handed to Oddo"},"source":null,"icon":null},{"id":"WPN_SM_AbyssRift","order":52,"slot":"weapon","kind":"greatsword","type":"Weapon","name":{"ru":"Разлом бездны","en":"Rift of the Abyss"},"flavour":{"ru":"Зазубренный клинок, похожий на трещину в мире. Таким был свет Семерых изнутри. Его удар раскалывает любую броню. Даёт навык «Раскол брони».","en":"A jagged blade like a crack in the world. That is what the Seven's light looked like from inside. Its strike splits any armour. Grants the skill “Armour Break”."},"tier":4,"from":13,"until":null,"rarity":"Legendary","bonus":[{"ru":"Урон: физический","en":"Damage: physical"},{"r ame":{"ru":"Посох брата Корвина","en":"Brother Korvin's Staff"},"flavour":{"ru":"Посох магистра с крюком для фонаря на навершии. Крюк пуст. На древке – зарубки, по одной на год службы. Их четыреста восемь.","en":"A magister's staff with a lantern hook on its head. The hook is empty. Notches on the shaft, one for each year of service. There are four hundred and eight."},"tier":"Q","from":null,"until":null,"rarity":null,"bonus":[{"ru":"Урон: физический","en":"Damage: physical"},{"ru":"+1 Призывание","en":"+1 Summoning"},{"ru":"+1 Лидерство","en":"+1 Leadership"},{"ru":"+1 Память","en":"+1 Memory"}],"set":null,"relic":null,"source":{"ru":"Акт 1, «Фонарь дозора»: казнить брата Корвина.","en":"Act 1, “The Watch's Lantern”: execute brother Korvin."},"icon":null},{"id":"ARM_SM_ChitinCrown","order":59,"slot":"head","kind":"light","type":"Armor","name":{"ru":"Хитиновый венец","en":"The Chitin Crown"},"flavour":{"ru":"Голова Матки гнезда, сросшаяся в венец. Пока он на вас, тени Повелителя затягивают раны каждым убийством. Если прислушаться, внутри кто-то шепчет. Если прислушаться дольше – просит.","en":"The Brood Mother's head grown into a crown. While you wear it, the Sovereign's shadows close their wounds with every kill. Listen closely and someone is whispering inside. Listen longer and they are begging."},"tier":"Q","from":null,"until":null,"rarity":null,"bonus":[{"ru":"+1 Призывание","en":"+1 Summoning"},{"ru":"+2 Инициатива","en":"+2 Initiative"},{"ru":"+1 Телосложение","en":"+1 Constitution"}],"set":null,"relic":null,"source":{"ru":"Акт 2, Гнездо Пожирателя: выбрать венец после боя с Маткой.","en":"Act 2, the Devourer's Nest: choose the crown after the Brood Mother."},"icon":null},{"id":"WPN_SM_KaelSword","order":60,"slot":"weapon","kind":"sword","type":"Weapon","name":{"ru":"Меч сира Каэла","en":"Sword of Sir Kael"},"flavour":{"ru":"Меч командира стражи Иссара. Он стоял у ворот павшего королевства тысячу лет и теперь стоит рядом с вами. Даёт навык «Знамя Иссара».","en     slot:{head:"Голова",chest:"Тело",hands:"Руки",legs:"Ноги",feet:"Ступни",weapon:"Оружие",shield:"Щит",ring:"Кольцо",amulet:"Амулет",belt:"Пояс"},
    kind:{mage:"мантия",heavy:"латы",light:"кожа",staff:"посох, двуручный",dagger:"кинжал",sword:"меч, одноручный",greatsword:"меч, двуручный"},
    tier:"Продаётся с %d уровня",tierQ:"Награды за задания",tierQd:"Не продаются: их находят по сюжету.",from:"С %d уровня",range:"Уровни %a–%b",
    quest:"Задание",lock:"Открывается:",step1:"Шаг 1 – шлем, перчатки, оружие и щит комплекта:",step2:"Шаг 2 – остальной комплект и украшения яруса:",
    src:"Где:",flav:"Предание",pieces:"Части",aura:"Аура",setLv:"Продаётся с %d уровня",n:"%d частей",
    guides:"Наставления Безмолвной рати",guidesD:"Всегда на полке, по одной. Каждый Повелитель к тому же один раз получает все четыре даром.",
    lore:"Книги рати",loreD:"Торговец рассказывает историю акт за актом: книга появляется, когда ваша игра дошла до её акта.",act:"с %d акта",
    skillbooks:"Книги навыков – в справочнике навыков.",empty:"Под этот фильтр ничего не подходит.",
    foot:["Данные взяты из исходников мода (генератор снаряжения, скрипты торговцев; версия 1.5.9). Бонусы – постоянные бонусы каждой вещи; базовая броня и урон оружия зависят от уровня вещи, а это уровень Повелителя в момент, когда торговец обновляет товар.",
      "«Уровни a–b» выведены из правила лавки: ярус продаётся, пока не откроется ярус через один. Вещи класса не требуют очков характеристик."]}
};
const SLOTS=["head","chest","hands","legs","feet","weapon","shield","ring","amulet","belt"];
const SVG={
  head:'<path d="M6 17v-5a6 6 0 0 1 12 0v5"/><path d="M4 17h16"/><path d="M12 6V3"/>',
  chest:'<path d="M8 3 4 6v5l3 1v9h10v-9l3-1V6l-4-3"/><path d="M8 3c1 2 7 2 8 0"/>',
  hands:'<path d="M7 21v-6L5 11V7a1.5 1.5 0 0 1 3 0v3V5a1.5 1.5 0 0 1 3 0v5V4a1.5 1.5 0 0 1 3 0v6V6a1.5 1.5 0 0 1 3 0v8l-2 3v4"/>',
  legs:'<path d="M6 3h12v6l-2 12h-3l-1-10-1 10H8L6 9z"/>',
  feet:'<path d="M8 3v10l-3 3v3h13v-2l-5-2V3"/>',
  weapon:'<path d="M14 4h6v6L9 21l-3-3z"/><path d="M5 13l6 6"/><path d="M3 21l3-3"/>',
  shield:'<path d="M12 3 4 6v6c0 5 4 8 8 9 4-1 8-4 8-9V6z"/>',
  ring:'<circle cx="12" cy="15" r="6"/><path d="M9 6l3-3 3 3-3 3z"/>',
  amulet:'<path d="M5 3c0 6 3 9 7 9s7-3 7-9"/><path d="M12 12l-3 4 3 5 3-5z"/>',
  belt:'<rect x="2" y="9" width="20" height="6" rx="1"/><rect x="9" y="8" width="6" height="8" rx="1"/>',
  book:'<path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-5a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h5z"/>'};
let lang="en",view="items",slot="all",set="all",asc=true,q="";
try{const s=localStorage.getItem("ss_lang");if(s==="ru"||s==="en")lang=s}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SETS=Object.fromEntries(D.sets.map(s=>[s.key,s]));
const ITEM=Object.fromEntries(D.items.map(i=>[i.id,i]));
function chip(label,pressed,on,cls){const b=document.createElement("button");b.className="chip"+(cls?" "+cls:"");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",pressed);b.onclick=on;return b}
function setLang(l){lang=l;try{localStorage.setItem("ss_lang",l)}catch(e){}render()}
const icon=(src,kind)=>src?`<img class="icon" src="${src}" alt="" width="56" height="56">`:`<div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${SVG[kind]}</svg></div>`;
function renderBar(){
  const t=T[lang];
  $("tabs").replaceChildren(...["items","sets","books"].map(k=>chip(t.tabs[k],view===k,()=>{view=k;render()},"tab")));
  $("lang").replaceChildren(chip("EN",lang==="en",()=>setLang("en")),chip("RU",lang==="ru",()=>setLang("ru")));
  const show=view==="items";$("filters").hidden=!show;$("filters2").hidden=!show;
  $("slots").replaceChildren(chip(t.all,slot==="all",()=>{slot="all";render()}),...SLOTS.map(k=>chip(t.slot[k],slot===k,()=>{slot=k;render()})));
  $("sets").replaceChildren(chip(t.all,set==="all",()=>{set="all";render()}),...D.sets.map(s=>chip(s.name[lang],set===s.key,()=>{set=s.key;render()})),chip(t.noset,set==="none",()=>{set="none";render()}));
  $("sort").replaceChildren(chip(asc?t.asc:t.desc,true,()=>{asc=!asc;render()}));
  $("q").placeholder=t.search;$("q").setAttribute("aria-label",t.search);
}
function levels(i){const t=T[lang];return i.until?t.range.replace("%a",i.from).replace("%b",i.until):t.from.replace("%d",i.from)}
function card(i){
  const t=T[lang],s=i.set&&SETS[i.set];
  const badges=[i.tier==="Q"?`<span class="badge qs">${t.quest}</span>`:`<span class="badge lv">${levels(i)}</span><span class="badge leg">${esc(D.rarity[lang])}</span>`];
  if(s)badges.push(`<button class="badge set" type="button" data-set="${s.key}">${esc(s.name[lang])}</button>`);
  const kind=t.slot[i.slot]+(i.kind?" · "+t.kind[i.kind]:"");
  return `<article class="card${i.tier==="Q"?" q":""}">${icon(i.icon,i.slot)}<div class="main">
    <div class="title"><h3>${esc(i.name[lang])}</h3>${badges.join("")}</div>
    <div class="kind">${esc(kind)}</div>
    <ul class="bon">${i.bonus.map(b=>`<li>${esc(b[lang])}</li>`).join("")}</ul>
    ${i.relic?`<p class="lock"><b>${t.lock}</b> ${esc(i.relic[lang])}</p>`:""}
    ${i.source?`<p class="src"><b>${t.src}</b> ${esc(i.source[lang])}</p>`:""}
    <details class="fl"><summary>${t.flav}</summary><p class="flav">${esc(i.flavour[lang])}</p></details>
  </div></article>`;
}
function items(){
  const t=T[lang],needle=q.trim().toLowerCase();
  const list=D.items.filter(i=>(slot==="all"||i.slot===slot)&&(set==="all"||(set==="none"?!i.set:i.set===set))
    &&(!needle||(i.name.en+" "+i.name.ru+" "+i.bonus.map(b=>b[lang]).join(" ")+" "+i.flavour[lang]).toLowerCase().includes(needle)));
  const groups=D.tiers.map(x=>({key:x.tier,title:t.tier.replace("%d",x.from),list:list.filter(i=>i.tier===x.tier)}));
  if(!asc)groups.reverse();
  groups.push({key:"Q",title:t.tierQ,sub:t.tierQd,list:list.filter(i=>i.tier==="Q")});
  const html=groups.filter(g=>g.list.length).map(g=>`<section class="group"><div class="ghead"><h2>${g.title}</h2><p>${g.sub?g.sub+" · ":""}${g.list.length}</p></div><div class="grid">${g.list.map(card).join("")}</div></section>`).join("");
  return html||`<p class="empty">${t.empty}</p>`;
}
function sets(){
  const t=T[lang],lv=Object.fromEntries(D.tiers.map(x=>[x.tier,x.from]));
  return `<section class="group"><div class="grid wide">${D.sets.map(s=>`<article class="setcard" id="set-${s.key}">
    <div class="sethead">${icon(s.icon,"chest")}<div><h3>${esc(s.name[lang])}</h3><div class="kind">${t.setLv.replace("%d",lv[s.tier])} · ${t.n.replace("%d",s.pieces.length)}</div></div></div>
    <ul class="tiers">${s.bonus.map(b=>`<li><span>${b.n}</span><div>${esc(b[lang])}</div></li>`).join("")}</ul>
    ${s.aura?`<p class="pieces"><b>${t.aura} ${lang==="ru"?"«"+esc(s.aura.name[lang])+"»":"“"+esc(s.aura.name[lang])+"”"}</b> (${s.aura.radius} ${lang==="ru"?"м":"m"}): ${esc(s.aura.text[lang])}</p>`:""}
    <p class="pieces"><b>${t.pieces}:</b> ${s.pieces.map(p=>esc(ITEM[p].name[lang])).join(", ")}</p>
    <ol class="steps"><li>${t.step1} ${esc(s.open1[lang])}</li><li>${t.step2} ${esc(s.open2[lang])}</li></ol>
  </article>`).join("")}</div></section>`;
}
function books(){
  const t=T[lang],row=(b,sub)=>`<div class="book">${icon(null,"book")}<div><b>${esc(b.name[lang])}</b>${sub?`<small>${sub}</small>`:""}</div></div>`;
  return `<section class="group"><div class="ghead"><h2>${t.guides}</h2><p>${t.guidesD}</p></div><div class="books">${D.books.filter(b=>b.kind==="guide").map(b=>row(b)).join("")}</div></section>
  <section class="group"><div class="ghead"><h2>${t.lore}</h2><p>${t.loreD}</p></div><div class="books">${D.books.filter(b=>b.kind==="lore").map(b=>row(b,t.act.replace("%d",b.act))).join("")}</div></section>
  <p class="note">${t.skillbooks}</p>`;
}
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede;
  $("foot").innerHTML=t.foot.map(p=>`<p>${esc(p)}</p>`).join("");
  renderBar();
  $("list").innerHTML=view==="items"?items():view==="sets"?sets():books();
}
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-set]");if(!b)return;view="sets";render();const el=$("set-"+b.dataset.set);if(el)el.scrollIntoView({block:"start"})});
$("q").addEventListener("input",e=>{q=e.target.value;render()});
render();
</script>
</body>
</html>
