<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadow Sovereign Bestiary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Forum&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">

<style>
/* Layout: a muster roll – rules of the host, then the kinds of shadows, their ranks and (behind a spoiler) the named ones */
:root{
  --bg:#120e19; --panel:#1b1525; --panel2:#231b30; --line:#3a2e4c;
  --fg:#e9e2f2; --muted:#a99cba; --gold:#d8b36a; --violet:#b57dff; --crimson:#ff6b6b; --ink:#7fb1ff;
  --display:"Cinzel","Forum",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
header.hero{padding-block:28px 20px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{font:inherit;font-size:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
button.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:700}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.search{flex:1 1 180px;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.lang{margin-left:auto}
section.group{padding-top:28px}
.ghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ghead h2{font-family:var(--display);font-size:22px;margin:0;color:var(--gold);letter-spacing:.06em}
.ghead p{margin:0;color:var(--muted);font-size:14px}
ol.rules{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px;counter-reset:r}
ol.rules li{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:10px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
article.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;grid-template-columns:64px 1fr;gap:14px;min-width:0}
article.card.kael{border-color:color-mix(in srgb,var(--crimson) 50%,var(--line))}
article.card.oddo{border-color:color-mix(in srgb,var(--ink) 50%,var(--line))}
.icon{width:64px;height:64px;border-radius:4px;border:1px solid var(--gold);box-shadow:0 0 0 3px var(--panel2);background:var(--panel2)}
.main{min-width:0;display:grid;gap:8px;align-content:start}
.title{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.title h3{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.03em}
.badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:3px;padding:1px 7px;font-weight:700;color:var(--gold);border:1px solid var(--gold);white-space:nowrap}
.desc{margin:0;color:var(--muted);font-style:italic;font-size:15px}
.kv{margin:0;font-size:15px}.kv b{color:var(--gold);font-weight:500}
ul.bon{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 6px}
ul.bon li{font-size:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-variant-numeric:tabular-nums}
.skill{display:grid;grid-template-columns:40px 1fr;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:8px}
.skill img,.skill .ph{width:40px;height:40px;border-radius:3px;border:1px solid var(--line)}
.skill h4{margin:0;font-size:15px;font-weight:700}.skill h4 small{font-weight:400;color:var(--muted);margin-left:6px}
.skill p{margin:2px 0 0;font-size:14px}
ol.stages{margin:0;padding-left:1.3em;display:grid;gap:4px;font-size:14px}
ol.stages b{font-weight:500;color:var(--gold)}
ul.extra{margin:0;padding-left:1.2em;font-size:14px;display:grid;gap:3px}
details.spoil{background:var(--panel);border:1px dashed var(--line);border-radius:6px;padding:12px 16px}
details.spoil summary{cursor:pointer;color:var(--gold);font-family:var(--display);letter-spacing:.05em}
details.spoil[open]{background:none;border:0;padding:0}
details.spoil[open] summary{margin-bottom:14px}
.note{font-size:13px;color:var(--muted);font-style:italic;margin:0}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
footer p{margin:0}
@media (max-width:640px){.bar{position:static}.lang{margin-left:0}}
@media (max-width:480px){article.card{grid-template-columns:48px 1fr;padding:12px}.icon{width:48px;height:48px}}
@media (prefers-reduced-motion:no-preference){article.card{transition:border-color .15s}article.card:hover{border-color:var(--gold)}}
html[lang="ru"] :is(h1,h2,h3){font-synthesis:none}
</style>

<div class="wrap">
<header class="hero">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
</header>
<div class="bar" role="toolbar">
  <div class="chips" id="parts"></div>
  <input class="search" id="q" type="search" autocomplete="off">
  <div class="chips lang" id="lang"></div>
</div>
<main id="list"></main>
<footer id="foot"></footer>

mory. Give it to the shadow merchant and a nameless Crimson Knight joins the host. The third and fourth shards give him back his name and memory."},"extra":[{"ru":"Элитная тень без рангов; её нельзя изгнать, в «Смотре войска» её можно взять под своё управление.","en":"An elite shadow without ranks; it cannot be banished, and in “Muster the Army” you may take it under your own control."},{"ru":"Сражается мечом и щитом алого рыцаря; они исчезают вместе с ним и не становятся добычей.","en":"Fights with the Crimson Knight's sword and shield; they vanish with him and never become loot."},{"ru":"Когда память вернулась целиком, его можно отпустить по Уставу: Каэл уходит навсегда, а «Меч сира Каэла» остаётся у вас.","en":"Once his memory is whole, you may set him free by the Code: Kael leaves for good and the Sword of Sir Kael stays with you."}],"icon":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAuf0lEQVR4nGW7d5hlVZnvv9M5e6+89t4nnzpVdfKpnDrnUJ0jockokgS6Sd0goOQgNEJjEwWRMIQRQVAJYkZFBx0DIkpSmXHmemf0PneYiwg01d/+uXYV6P3dP95nn6fqdFe9n/V94zplMaYrmmmWpYoVqWIVIvt7qLS6qbYqLLR6WGhVqW5UmW6MMmmtImJgkvDNc5gis1h49hwRnTZXRGNLuB7bwsSm8wgbuz1gmz9F+dh5TIx9gsmt11JJP0fF0JeJ2PoDIssPivjopWH+6NHuavmTxx/kfnzpUvd7lar7Mxm5P5Ox81MZOc/I0PkCVc5jLHT2MO3sEso5QyrnTKGsU7iyTuZ67HAeXnEQD1cfx+Tq7YSt3kJlfZbU9mwe2rO5tie4tkd4aHd4aNd4aHeL0C6K0Crw0Oliod3NlGVxpjOahcb5FV1EtnoCua1GlNVLdX8vCy+tsnBvg+m9HapOH6bKOpTwzcdSdvMyqgYWM332chH9drmI9m3k8rQPU3b1FYRuv4OwB+9i/Nk9TOy+l6tbP8/E0Jep3PptrnbdIOOj52a6Lmzku+8cb7bKt1xwUvuMg7dsuHByjfu9WrP9SphZ92sdNV8KY+f7PHQe58q5lWnnAqF3XCXU49cyecUVVD5yAVePHM/1UcdztfokKlafR5h1DBHWfKHt+TxMbJxH9iiL7EEeJQDKIjGrzEO3h2unl2nb4ix0NAudElVONxFODxVWjaj+OlXbWlT9us30q02m9vZRtbefqacWE/7qBsL3r2Ty1RUifHW10Ps2cP3bw5j87XZKf3s5oc/uJvTZWyn711soe/brTP3mWa5/85iMv3ZyWLp1tFi/s7+7dWenu3nn2MDAhbdetOPMXR8++qaLTz1xw+XbDj7zi+OznvhFubLuxShu/khE656mau29TK29hovHP8PkvtuoxB4qcTmXj5zD5dguLk/dQcX1FxL2pRMJP3UpU6sW87C+iIf2mIjtQRHZHRHZNRHZZTkNoJvrVJXpVJVqaxoA106eqlYXla0eIvprRD7cIPLXw1T9eoAaAPLVDlUHBpk+MJvK const T = {
  en:{eyebrow:"Shadow Sovereign · DOS2 Definitive Edition",h1:"Bestiary of the Silent Host",
    lede:"What rises from a corpse and how it fights: the rules of binding, the eight kinds of shadows, their ranks and the shadows that speak.",
    parts:{all:"All",rules:"Rules",kinds:"Kinds",ranks:"Ranks",unique:"Unique"},search:"Search shadows…",
    rules:"Rules of the host",kinds:"Kinds of shadows",kindsD:"A shadow remembers its body: the kind is chosen by what the foe was, checked in this order.",
    ranks:"Ranks",ranksD:"An elite shadow carries its status instead of the plain one; veteran and named add to it.",
    unique:"Shadows that speak",uniqueD:"Story spoilers: how they join and what they become.",show:"Show the unique shadows (spoilers)",
    from:"Rises from:",role:"In battle:",bonus:"Bonuses",how:"How to get:",cd:"cooldown",turns:"turns",turn:"turn",kind:"Kind",
    stages:"Memory comes back with the shards:",gives:"adds",
    rel:"“N% damage” is relative: the hit's base grows with the shadow's level (the level of the foe it was), the exact number is shown in game.",
    empty:"No shadow matches this search.",
    foot:["Data comes from the mod's own sources (Shadows.lua, Ranks.lua, the status and skill files; version 1.5.9). Shadows also keep up to 4 combat skills of the foe they were – those depend on the foe and are not listed here.",
      "Bonuses are percentages of the shadow's own values; a shadow's level is the level of the foe it was bound from."]},
  ru:{eyebrow:"Повелитель Теней · DOS2 Definitive Edition",h1:"Бестиарий Безмолвной рати",
    lede:"Что встаёт из трупа и как оно сражается: правила пленения, восемь видов теней, их ранги и тени, которые говорят.",
    parts:{all:"Все",rules:"Правила",kinds:"Виды",ranks:"Ранги",unique:"Особые"},search:"Поиск тени…",
    rules:"Правила войска",kinds:"Виды теней",kindsD:"Тень помнит своё тело: вид выбирается по тому, кем был враг, проверка идёт в этом порядке.",
    ranks:"Ранги",ranksD:"Элитная тень носит свой статус вместо обычного; ветеран и именная добавляют к нему.",
    unique:"Тени, которые говорят",uniqueD:"Спойлеры сюжета: как они приходят и кем становятся.",show:"Показать особые тени (спойлеры)",
    from:"Встаёт из:",role:"В бою:",bonus:"Бонусы",how:"Как получить:",cd:"перезарядка",turns:"ход.",turn:"ход",kind:"Вид",
    stages:"Память возвращается с осколками:",gives:"добавляет",
    rel:"«N% урона» – относительное число: основа удара растёт с уровнем тени (уровнем врага, которым она была), точное число показывает игра.",
    empty:"Ни одна тень не подходит под поиск.",
    foot:["Данные взяты из исходников мода (Shadows.lua, Ranks.lua, файлы статусов и навыков; версия 1.5.9). Тени к тому же сохраняют до 4 боевых навыков своего врага – они зависят от врага и здесь не перечислены.",
      "Бонусы – проценты от собственных значений тени; уровень тени – уровень врага, из которого её пленили."]}
};
let lang="en",part="all",q="",spoil=false;
try{const s=localStorage.getItem("ss_lang");if(s==="ru"||s==="en")lang=s}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const quote=s=>lang==="ru"?`«${esc(s)}»`:`“${esc(s)}”`;
const KIND=Object.fromEntries(D.kinds.map(k=>[k.id,k]));
function chip(label,pressed,on){const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=label;b.setAttribute("aria-pressed",pressed);b.onclick=on;return b}
function setLang(l){lang=l;try{localStorage.setItem("ss_lang",l)}catch(e){}render()}
const img=(src,cls)=>src?`<img class="${cls}" src="${src}" alt="" width="64" height="64">`:`<div class="${cls} ph"></div>`;
const bon=list=>list.length?`<ul class="bon">${list.map(b=>`<li>${esc(b[lang])}</li>`).join("")}</ul>`:"";
function skill(s){const t=T[lang];const cd=s.cooldown?` <small>${t.cd} ${s.cooldown} ${s.cooldown===1?t.turn:t.turns}</small>`:"";
  return `<div class="skill">${img(s.icon,"")}<div><h4>${esc(s.name[lang])}${cd}</h4><p>${esc(s.desc[lang])}</p></div></div>`}
function kindCard(k){const t=T[lang];
  return `<article class="card">${img(k.icon,"icon")}<div class="main">
    <div class="title"><h3>${esc(k.name[lang])}</h3></div>
    <p class="desc">${esc(k.desc[lang])}</p>
    <p class="kv"><b>${t.from}</b> ${esc(k.from[lang])}</p>
    <p class="kv"><b>${t.role}</b> ${esc(k.role[lang])}</p>
    ${bon(k.boosts)}${k.skills.map(skill).join("")}</div></article>`}
function rankCard(r){
  return `<article class="card">${img(r.icon,"icon")}<div class="main">
    <div class="title"><h3>${esc(r.name[lang])}</h3></div>
    <p class="kv">${esc(r.when[lang])}</p>${bon(r.boosts)}<p class="desc">${esc(r.desc[lang])}</p></div></article>`}
function uniqueCard(u){const t=T[lang],k=KIND[u.type];
  const stages=u.stages?`<p class="kv"><b>${t.stages}</b></p><ol class="stages">${u.stages.map(s=>`<li><b>${esc(s.name[lang])}</b> – ${t.gives} ${quote(s.skillName[lang])}. ${esc(s.desc[lang])}</li>`).join("")}</ol>`:"";
  return `<article class="card ${u.key}">${img(u.icon,"icon")}<div class="main">
    <div class="title"><h3>${esc(u.name[lang])}</h3>${k?`<span class="badge">${t.kind}: ${esc(k.name[lang])}</span>`:""}</div>
    <p class="desc">${esc(u.desc[lang])}</p>
    <p class="kv"><b>${t.how}</b> ${esc(u.how[lang])}</p>
    ${bon(u.boosts)}${u.skills.map(skill).join("")}${stages}
    <ul class="extra">${u.extra.map(e=>`<li>${esc(e[lang])}</li>`).join("")}</ul></div></article>`}
const text=o=>JSON.stringify(o,(k,v)=>k==="icon"?undefined:v).toLowerCase();
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede;
  $("foot").innerHTML=t.foot.map(p=>`<p>${esc(p)}</p>`).join("");
  $("parts").replaceChildren(...Object.keys(t.parts).map(k=>chip(t.parts[k],part===k,()=>{part=k;render()})));
  $("lang").replaceChildren(chip("EN",lang==="en",()=>setLang("en")),chip("RU",lang==="ru",()=>setLang("ru")));
  $("q").placeholder=t.search;$("q").setAttribute("aria-label",t.search);
  const needle=q.trim().toLowerCase(),hit=o=>!needle||text(o).includes(needle),on=k=>part==="all"||part===k;
  let html="";
  if(on("rules")&&!needle)html+=`<section class="group"><div class="ghead"><h2>${t.rules}</h2></div><ol class="rules">${D.rules.map(r=>`<li>${esc(r[lang])}</li>`).join("")}</ol></section>`;
  const kinds=D.kinds.filter(hit);
  if(on("kinds")&&kinds.length)html+=`<section class="group"><div class="ghead"><h2>${t.kinds}</h2><p>${t.kindsD}</p></div><div class="grid">${kinds.map(kindCard).join("")}</div><p class="note" style="margin-top:10px">${t.rel}</p></section>`;
  const ranks=D.ranks.filter(hit);
  if(on("ranks")&&ranks.length)html+=`<section class="group"><div class="ghead"><h2>${t.ranks}</h2><p>${t.ranksD}</p></div><div class="grid">${ranks.map(rankCard).join("")}</div></section>`;
  const uniq=D.unique.filter(hit);
  if(on("unique")&&uniq.length){
    const open=spoil||part==="unique"||!!needle;
    html+=`<section class="group"><div class="ghead"><h2>${t.unique}</h2><p>${t.uniqueD}</p></div><details class="spoil" id="spoil"${open?" open":""}><summary>${t.show}</summary><div class="grid">${uniq.map(uniqueCard).join("")}</div></details></section>`;
  }
  $("list").innerHTML=html||`<p class="empty">${t.empty}</p>`;
  const d=$("spoil");if(d)d.addEventListener("toggle",()=>{spoil=d.open});
}
$("q").addEventListener("input",e=>{q=e.target.value;render()});
render();
</script>
