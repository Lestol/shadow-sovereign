<title>Shadow Sovereign Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+SC:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">

<style>
/* Layout: the four guide books of the Silent Host as one long read – contents, first steps, then book by book */
:root{
  --bg:#120e19; --panel:#1b1525; --panel2:#231b30; --line:#3a2e4c;
  --fg:#e9e2f2; --muted:#a99cba; --gold:#d8b36a; --violet:#b57dff;
  --display:"Cinzel","Cormorant SC",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;overflow-wrap:anywhere}
.wrap{max-width:900px;margin:0 auto}
.ssnav{max-width:900px!important}
header.hero{padding-block:28px 20px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance}
.lede{color:var(--muted);max-width:64ch;margin:0}
.lang{display:flex;gap:6px;margin-top:6px}
button.chip{font:inherit;font-size:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
button.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
nav.toc{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
nav.toc h2{margin:0 0 8px;font-family:var(--display);font-size:15px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
nav.toc ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
nav.toc a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line)}
nav.toc a:hover{color:var(--gold);border-bottom-color:var(--gold)}
nav.toc ol ol{padding-left:1.1em;margin:4px 0 6px;display:flex;flex-wrap:wrap;gap:2px 14px;list-style:none;font-size:14px}
nav.toc ol ol a{color:var(--muted);border-bottom:0}
section.book{padding-top:34px}
section.book>h2{font-family:var(--display);font-size:clamp(22px,4vw,28px);margin:0 0 6px;color:var(--gold);letter-spacing:.05em}
.intro{margin:0 0 16px;color:var(--muted);font-style:italic}
.part{border-left:3px solid var(--line);padding:4px 0 4px 16px;margin:0 0 18px}
.part h3{margin:0 0 4px;font-family:var(--display);font-size:16px;letter-spacing:.08em;color:var(--fg)}
.part h3 small{font-family:var(--body);font-size:14px;letter-spacing:0;color:var(--muted);font-weight:400;margin-left:6px}
.part p{margin:0 0 6px}
.part ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.part b{color:var(--gold);font-weight:700}
.see{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0}
.see a{font-size:15px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:5px 10px;background:var(--panel)}
.see a:hover{border-color:var(--gold)}
ol.first{margin:0;padding:0;list-style:none;counter-reset:f;display:grid;gap:10px}
ol.first li{counter-increment:f;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px 10px 48px;position:relative}
ol.first li::before{content:counter(f);position:absolute;left:14px;top:9px;font-family:var(--display);font-weight:700;color:var(--gold);font-size:18px}
.top{display:inline-block;margin-top:2px;font-size:14px;color:var(--muted);text-decoration:none}
.top:hover{color:var(--gold)}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:0}
html[lang="ru"] :is(h1,h2,h3,.eyebrow){font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header class="hero" id="top">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
  <div class="lang" id="lang"></div>
</header>
<nav class="toc" id="toc" aria-labelledby="toch"></nav>
<main id="list"></main>
<footer id="foot"></footer>
</div>
<script>
const D = {"first":[{"ru":"Новая игра → в разделе «Класс» выберите шаблон «Повелитель Теней». Вы начинаете с «Пленения тени», «Теневого войска» и «Сокрушающей длани». Добавили мод в начатую игру? Купите «Пленение тени» у теневого торговца.","en":"New game → in the Class section pick the Shadow Sovereign preset. You start with Bind Shadow, Shadow Army and Crushing Hand. Added the mod to a game in progress? Buy Bind Shadow from a Shadow Merchant."},{"ru":"Выиграйте бой и бросьте «Пленение тени» на труп – его тень навсегда встаёт в ваше войско.","en":"Win a fight, then cast Bind Shadow on a corpse – its shadow joins your army for good."},{"ru":"«Теневое войско» зовёт тени на поле. Сколько их придёт, зависит от Призывания.","en":"Cast Shadow Army to call your shadows to the field. How many come depends on your Summoning."},{"ru":"Откройте «Смотр войска» (бесплатно, вне боя): сколько теней зовёт «Теневое войско», любимцы в авангард, выбор Устава.","en":"Open Muster the Army (free, out of combat): set how many shadows Shadow Army calls, put favourites in the vanguard, pick the Code."},{"ru":"Прочтите 4 книги-наставления в инвентаре – каждый Повелитель получает их один раз. Новые книги и снаряжение ждут у теневых торговцев в хабах актов.","en":"Read the 4 guide books in your inventory – every Sovereign gets them once. More books and gear wait at the Shadow Merchants in the act hubs."}],"books":[{"id":"guide_army","title":{"ru":"Пленение и войско","en":"Binding and the Host"},"ru":{"intro":"Записки Безмолвной рати для нового Повелителя. Мёртвым спешить некуда, но и болтать незачем: читайте по разделу.","sections":[{"title":"ПЛЕНЕНИЕ","note":"","paras":[],"list":["«Пленение тени» бросают на труп.","Тень врага не выше вас уровнем встаёт всегда.","За каждый уровень сверх вашего она упирается сильнее: минус 20 к шансу из ста, но пять из ста остаются при любой разнице.","Полный комплект «Сумеречный странник» добавляет ещё 20."]},{"title":"ТРИ ПОПЫТКИ","note":"","paras":["Упрямая тень даёт три попытки, счёт виден над вашей головой."],"list":["Третий провал – и она рассеивается: этот труп потерян навсегда.","Не горюйте.","Павших в Ривеллоне хватает."]},{"title":"ЭЛИТА","note":"","paras":["Тень врага на два уровня выше вас или тень босса встаёт элитной: былая воля не растворилась в ней до конца. Элита сильнее прочих – и тяжелее, если Устав строг."],"list":[]},{"title":"ЗАПАС И ПОЛЕ","note":"","paras":["В войске держится до 16 теней."],"list":["Встала семнадцатая – самая слабая уходит навсегда, авангард уходит последним.","На поле стоит столько, сколько держит ваша воля: одна тень за каждый уровень Призывания и бонусы комплектов, не меньше одной и не больше десяти.","Остальные ждут в запасе, в вашей тени."]},{"title":"ТЕНЕВОЕ ВОЙСКО","note":"","paras":["«Теневое войско» поднимает тени из запаса: сначала авангард, затем сильнейшие. Отставших оно стягивает к вам. Павшая тень не умирает: она уходит в запас и встанет при следующем зове."],"list":[]},{"title":"ПОБЕДЫ","note":"","paras":["После 30 побед тень становится ветераном, после 60 вспоминает имя из прошлой жизни. Сильных войско зовёт раньше и держит дольше."],"list":[]},{"title":"СМОТР ВОЙСКА","note":"","paras":["Вне боя «Смотр войска» показывает весь строй, силу и победы каждой тени. Здесь тень призывают или возвращают в тень, ставят в авангард или изгоняют навсегда; можно призвать всех или отпустить всех. Первая строка задаёт, сколько теней держать на поле, если воля шире, чем нужно отряду."],"list":[]},{"title":"УСТАВ","note":"","paras":["Вторая строка смотра – Устав. <b>Вольный<\/b>: каждая тень занимает одно место. <b>Строгий<\/b>: элита весит два места, тень босса – три, лишние уходят в запас; вражеские боссы идут прямо к Повелителю; приёмы прошлой жизни тени берегут до вашего приказа. Посреди боя Устав не переписывают."],"list":[]}]},"en":{"intro":"Notes of the Silent Host for a new Sovereign. The dead are in no hurry, but they waste no words either: read one section at a time.","sections":[{"title":"BINDING","note":"","paras":[],"list":["“Bind Shadow” is cast on a corpse.","The shadow of a foe no higher in level than you always rises.","Every level above yours makes it fight back harder: 20 less out of a hundred, though five in a hundred remain whatever the gap.","The full Duskwalker set adds another 20."]},{"title":"THREE TRIES","note":"","paras":["A stubborn shadow allows three tries; the count shows above your head."],"list":["Fail the third and it scatters: that corpse is lost for good.","Do not mourn it.","Rivellon has no shortage of the fallen."]},{"title":"ELITES","note":"","paras":["The shadow of a foe two levels above you, or of a boss, rises as an elite: its old will never fully dissolved. Elites are stronger than the rest, and heavier when the Code is strict."],"list":[]},{"title":"RESERVE AND FIELD","note":"","paras":["The host holds up to 16 shadows."],"list":["When a seventeenth rises, the weakest leaves for good; the vanguard leaves last.","On the field stand as many as your will can hold: one shadow per point of Summoning plus set bonuses, never fewer than one, never more than ten.","The rest wait in reserve, in your shadow."]},{"title":"SHADOW ARMY","note":"","paras":["“Shadow Army” raises shadows from the reserve: the vanguard first, then the strongest. It also pulls stragglers back to you. A fallen shadow does not die: it returns to the reserve and rises at the next call."],"list":[]},{"title":"VICTORIES","note":"","paras":["After 30 victories a shadow becomes a veteran; after 60 it remembers a name from its past life. The host calls the strong earlier and keeps them longer."],"list":[]},{"title":"MUSTER THE ARMY","note":"","paras":["Out of combat, “Muster the Army” shows the whole rank with each shadow's power and victories. Here you call a shadow or send it back, put it in the vanguard or banish it for good; you can also call or release them all. The first line sets how many shadows to keep on the field, if your will is wider than your party needs."],"list":[]},{"title":"THE CODE","note":"","paras":["The second line of the muster is the Code. <b>Lenient<\/b>: every shadow takes one place. <b>Strict<\/b>: an elite weighs two places, a boss's shadow three, and the excess falls back into reserve; enemy bosses come straight for the Sovereign; shadows save the moves of their past life for your order. The Code is not rewritten mid-battle."],"list":[]}]},"see":[{"href":"bestiary.html","en":"Bestiary: kinds of shadows and ranks","ru":"Бестиарий: виды теней и ранги"}]},{"id":"guide_orders","title":{"ru":"Приказы и тактика","en":"Orders and Tactics"},"ru":{"intro":"Записки Безмолвной рати, лист второй. Рать не ждёт слов. Но слышит их.","sections":[{"title":"САМИ ПО СЕБЕ","note":"","paras":["Тени сражаются сами."],"list":["В начале хода каждая делает главное дело своего рода, остальное доигрывает как умеет.","Из огня и яда выходят, израненные отступают к некроманту или к вам, стрелки уходят от клинков и ищут высоту.","Почти мёртвого врага добивают простым ударом."]},{"title":"РОДЫ ТЕНЕЙ","note":"","paras":["Тень помнит тело."],"list":["Человек встаёт Теневым воином и рубит достойную цель рядом.","Эльф – Теневым охотником, стреляет в самую ценную.","Гном – Теневым стражем: прикрывает вас и поднимает «Теневой оплот», когда свои стоят тесно.","Ящер – Теневым чернокнижником, раскалывает броню самого крепкого врага.","Нежить – Теневым некромантом, лечит раненых, вас первым.","Зверь бросается на магов и лекарей, порождение Пустоты встаёт Теневым отродьем.","Прочие – Теневые рыцари."]},{"title":"ЦЕЛЬ ПОВЕЛИТЕЛЯ","note":"","paras":["Ваша цель – цель войска: кого вы ударили последним, того рать бьёт первым."],"list":["«Метка Повелителя» и «Раскол брони» назначают цель и без удара.","Метка на 3 хода открывает жертву физическому урону и мешает ей уклоняться.","Раскол вскрывает броню."]},{"title":"ПРИКАЗ ПО УСТАВУ","note":"","paras":["Под строгим Уставом тени не тратят приёмы прошлой жизни по своей воле. Метка или Раскол брони в этом раунде – это приказ: до начала вашего следующего хода войско бьёт всем, что помнит. Приёмы своего рода тени держат всегда."],"list":[]},{"title":"ПРИКАЗ ВОЙСКУ","note":"","paras":[],"list":["«Приказ войску» меняет приказ по кругу.","Атака – тени бьются как обычно.","Защита – держатся рядом и бьют тех, кто подошёл к вам.","Держать позицию – не сходят с места."]},{"title":"КОМАНДЫ","note":"","paras":[],"list":["«Возвращение» – все тени мгновенно у ваших ног.","«Теневой перенос» – поменяйтесь местами с тенью до 30 м.","«Жертва тени» – поглотите тень: 40% здоровья и 1 очко Истока, а тень остаётся в войске.","«Вернуться в тень» – войско уходит в запас целиком."]},{"title":"ТЕ, КТО ГОВОРИТ","note":"","paras":["Иные тени – не просто тени. Их нельзя изгнать, а в «Смотре войска» их можно взять под своё управление. Если тень заговорит с вами – ответьте."],"list":[]}]},"en":{"intro":"Notes of the Silent Host, second leaf. The host does not wait for words. But it hears them.","sections":[{"title":"ON THEIR OWN","note":"","paras":["Shadows fight on their own."],"list":["At the start of its turn each does the main work of its kind and plays out the rest as it knows how.","They step out of fire and poison, the badly wounded fall back to a necromancer or to you, archers step away from blades and seek high ground.","A foe at death's door gets a plain blow."]},{"title":"KINDS OF SHADOWS","note":"","paras":["A shadow remembers its body."],"list":["A human rises as a Shadow Warrior and cuts down a worthy foe in reach.","An elf, as a Shadow Hunter, shoots the most valuable one.","A dwarf, as a Shadow Guardian, covers you and raises “Shadow Bulwark” when allies stand close.","A lizard, as a Shadow Warlock, cracks the armour of the toughest foe.","The undead, as Shadow Necromancers, heal the wounded, you first.","A beast leaps at mages and healers; a Voidwoken rises as Shadow Spawn.","All others are Shadow Knights."]},{"title":"THE SOVEREIGN'S TARGET","note":"","paras":["Your target is the host's target: whoever you struck last, the host strikes first."],"list":["“Sovereign's Mark” and “Armour Break” name the target even without a blow.","The Mark lays the victim open to physical damage for 3 turns and dulls its dodge.","Armour Break splits its armour."]},{"title":"ORDERS UNDER THE CODE","note":"","paras":["Under the Strict Code shadows do not spend the moves of their past life at will. A Mark or Armour Break this round is the order: until your next turn begins, the host strikes with all it remembers. The moves of their kind they always keep."],"list":[]},{"title":"ORDER THE ARMY","note":"","paras":[],"list":["“Order the Army” cycles the order.","Attack: shadows fight as usual.","Defend: they stay close and strike whoever comes at you.","Hold position: they do not move."]},{"title":"COMMANDS","note":"","paras":[],"list":["“Recall”: every shadow is at your feet at once.","“Shadow Swap”: trade places with a shadow up to 30m away.","“Shadow Sacrifice”: absorb a shadow for 40% health and 1 Source point; the shadow stays in the host.","“Return to Shadow”: the whole host goes back into reserve."]},{"title":"THOSE WHO SPEAK","note":"","paras":["Some shadows are more than shadows. They cannot be banished, and in “Muster the Army” you may take them under your own control. If a shadow speaks to you, answer it."],"list":[]}]},"see":[{"href":"bestiary.html","en":"Bestiary: what each kind does in battle","ru":"Бестиарий: что делает в бою каждый вид"}]},{"id":"guide_skills","title":{"ru":"Навыки и ломание брони","en":"Skills and Breaking Armour"},"ru":{"intro":"Записки Безмолвной рати, лист третий. Рать била так: сначала Повелитель, потом все.","sections":[{"title":"ШКОЛА","note":"","paras":["Все навыки Повелителя – школа Призывания. Каждый уровень Призывания – ещё и одна тень на поле, так что очки не пропадают даром."],"list":[]},{"title":"ВОЙСКО","note":"","paras":["Зов и уход: «Пленение тени», «Теневое войско», «Возвращение», «Вернуться в тень», «Теневой перенос», «Жертва тени». Сила рати: Приказ: «В атаку!», «Теневое восстановление», «Царство теней», «Пробуждение войска»."],"list":[]},{"title":"РАСКОЛ","note":"","paras":["Сам Повелитель бьёт тьмой, физическим уроном: «Сокрушающая длань», «Незримая длань», «Отбрасывание», «Теневой рывок», «Теневые когти», «Раскол брони», «Теневой взрыв», «Жажда убийства», «Казнь Повелителя», «Теневой обвал»."],"list":[]},{"title":"ТЬМА","note":"","paras":["Покровы и проклятия: «Метка Повелителя», «Покров тени», «Теневая броня», «Вечная преданность», «Теневая завеса», «Затмение». Отдельно – «Зов теневого торговца»: лавка выходит из вашей тени, только вне боя."],"list":[]},{"title":"РАСКОЛОТАЯ БРОНЯ","note":"","paras":["Главный удар класса."],"list":["Расколотая броня – минус 20% физической брони и 20% физического сопротивления.","Её накладывают «Сокрушающая длань» (2 хода), «Раскол брони» (3 хода), «Теневой обвал», с шансом – «Теневой взрыв».","Тени тоже: чернокнижник всегда, воин и рыцарь с шансом, а с полным «Алым рыцарем» – удар любой тени с шансом 25%."]},{"title":"ПОРЯДОК","note":"","paras":["Расколите броню, отметьте цель – и спустите войско. «Казнь Повелителя» особенно страшна по расколотой цели. Под строгим Уставом Раскол брони ещё и отдаёт рати приказ."],"list":[]},{"title":"ГДЕ БРАТЬ КНИГИ","note":"","paras":["Книги навыков – переписанные свитки писцов рати."],"list":["Их продают теневые торговцы.","Новые ярусы открываются с ростом Повелителя: с 1, 4, 9 и 13 уровня, и открытые книги из лавки уже не уходят.","Для заучивания нужно Призывание от 1 до 4, по ярусу."]}]},"en":{"intro":"Notes of the Silent Host, third leaf. The host struck like this: first the Sovereign, then everyone.","sections":[{"title":"THE SCHOOL","note":"","paras":["Every skill of the Sovereign belongs to Summoning. Each point of Summoning is also one more shadow on the field, so no point is wasted."],"list":[]},{"title":"THE HOST","note":"","paras":["Calling and parting: “Bind Shadow”, “Shadow Army”, “Recall”, “Return to Shadow”, “Shadow Swap”, “Shadow Sacrifice”. The host's strength: Command: “Attack!”, “Shadow Mending”, “Realm of Shadows”, “Army Awakening”."],"list":[]},{"title":"THE SHATTERING","note":"","paras":["The Sovereign strikes with darkness, as physical damage: “Crushing Hand”, “Unseen Hand”, “Repulse”, “Shadow Rush”, “Shadow Claws”, “Armour Break”, “Shadow Burst”, “Killing Intent”, “Sovereign's Execution”, “Shadow Collapse”."],"list":[]},{"title":"THE DARK","note":"","paras":["Veils and curses: “Sovereign's Mark”, “Shadow Shroud”, “Shadow Armour”, “Eternal Devotion”, “Veil of Shadows”, “Eclipse”. On its own, “Call the Shadow Merchant”: the shop steps out of your shadow, out of combat only."],"list":[]},{"title":"SHATTERED ARMOUR","note":"","paras":["The class's main blow."],"list":["Shattered Armour is 20% less physical armour and 20% less physical resistance.","It comes from “Crushing Hand” (2 turns), “Armour Break” (3 turns), “Shadow Collapse”, and by chance “Shadow Burst”.","Shadows bring it too: a warlock always, a warrior or knight by chance, and with the full Crimson Knight set any shadow's hit has a 25% chance."]},{"title":"THE ORDER OF BLOWS","note":"","paras":["Shatter the armour, mark the target, then let the host loose. “Sovereign's Execution” is at its deadliest against shattered armour. Under the Strict Code, Armour Break also gives the host its order."],"list":[]},{"title":"WHERE TO FIND BOOKS","note":"","paras":["Skill books are copies of the scrolls kept by the host's scribes."],"list":["Shadow merchants sell them.","New tiers open as the Sovereign grows: from level 1, 4, 9 and 13, and a book once on the shelf stays there.","Memorising one takes Summoning 1 to 4, by tier."]}]},"see":[{"href":"skills.html","en":"All skills: costs, cooldowns, book levels","ru":"Все навыки: стоимость, перезарядка, уровни книг"}]},{"id":"guide_gear","title":{"ru":"Снаряжение и торговцы","en":"Gear and Merchants"},"ru":{"intro":"Записки Безмолвной рати, лист четвёртый. Обоз отстаёт от войска на тысячу лет. Но приходит.","sections":[{"title":"ТЕНЕВЫЕ ТОРГОВЦЫ","note":"","paras":["Тени казначеев и обозных рати хранят сокровищницу Повелителя."],"list":["Они ждут в форте Радость, на Побережье Жнеца, на Безымянном острове и в Арксе.","«Зов теневого торговца» вызовет одного прямо из вашей тени.","С каждым актом торговцу есть что рассказать – спрашивайте."]},{"title":"ЧТО НА ПРИЛАВКЕ","note":"","paras":["Товар зависит от вашего уровня, не от торговца: новые ярусы с 1, 4, 9 и 13 уровня. Вещи – нынешнего яруса и прошлого, книги навыков копятся. Есть и летописи рати – их прибавляется с каждым актом."],"list":[]},{"title":"КОМПЛЕКТЫ","note":"","paras":["Четыре комплекта по 5 вещей, бонусы за 2, 3 и 5 надетых. Любое +1 к Призыванию – это ещё одна тень на поле."],"list":[]},{"title":"СУМЕРЕЧНЫЙ СТРАННИК","note":"(ярус 1)","paras":[],"list":["<b>2<\/b> – +1 Призывание.","<b>3<\/b> – +1 Память, +2 Инициатива.","<b>5<\/b> – шанс пленения тени +20%, тени наносят +10% урона, у врагов в 4 м −10% точности."]},{"title":"АЛЫЙ РЫЦАРЬ","note":"(ярус 2)","paras":[],"list":["<b>2<\/b> – +1 Лидерство.","<b>3<\/b> – тени: физическая броня +20%.","<b>5<\/b> – +1 тень в войске, тени наносят +15% урона, их удары с шансом 25% раскалывают броню."]},{"title":"КОРОЛЬ РОЯ","note":"(ярус 3)","paras":[],"list":["<b>2<\/b> – +1 Призывание.","<b>3<\/b> – тени: вампиризм +15%.","<b>5<\/b> – тени наносят +20% урона и ходят на 1 м дальше, их удары травят и пускают кровь."]},{"title":"ПОВЕЛИТЕЛЬ ТЕНЕЙ","note":"(ярус 4)","paras":[],"list":["<b>2<\/b> – +2 Память.","<b>3<\/b> – +1 тень в войске.","<b>5<\/b> – +1 Призывание, тени наносят +25% урона и получают +20% здоровья, у врагов в 5 м слабеет сопротивление."]},{"title":"РЕЛИКВИИ","note":"","paras":["Не всё лежит на прилавке."],"list":["Комплекты, их оружие и украшения яруса торговцы зовут реликвиями рати: их не продают – их отдают тем, кто заслужил.","Уровень открывает ярус, а реликвии открывают дела.","Торговец намекнёт, чего ждёт, журнал запомнит."]}]},"en":{"intro":"Notes of the Silent Host, fourth leaf. The baggage train runs a thousand years behind the army. But it arrives.","sections":[{"title":"SHADOW MERCHANTS","note":"","paras":["The shadows of the host's treasurers and quartermasters keep the Sovereign's treasury."],"list":["They wait in Fort Joy, on the Reaper's Coast, on the Nameless Isle and in Arx.","“Call the Shadow Merchant” brings one straight out of your shadow.","With every act a merchant has more to tell, so ask."]},{"title":"ON THE SHELF","note":"","paras":["The stock depends on your level, not the merchant's: new tiers open at level 1, 4, 9 and 13. Gear is of the current tier and the one before; skill books add up. There are chronicles of the host too, more with every act."],"list":[]},{"title":"SETS","note":"","paras":["Four sets of 5 pieces, with bonuses for 2, 3 and 5 worn. Every +1 Summoning is one more shadow on the field."],"list":[]},{"title":"DUSKWALKER","note":"(tier 1)","paras":[],"list":["<b>2<\/b> – +1 Summoning.","<b>3<\/b> – +1 Memory, +2 Initiative.","<b>5<\/b> – shadow binding chance +20%, shadows deal +10% damage, enemies within 4m lose 10% Accuracy."]},{"title":"CRIMSON KNIGHT","note":"(tier 2)","paras":[],"list":["<b>2<\/b> – +1 Leadership.","<b>3<\/b> – shadows gain +20% Physical Armour.","<b>5<\/b> – +1 shadow in the army, shadows deal +15% damage, their hits have a 25% chance to shatter armour."]},{"title":"SWARM KING","note":"(tier 3)","paras":[],"list":["<b>2<\/b> – +1 Summoning.","<b>3<\/b> – shadows gain +15% Lifesteal.","<b>5<\/b> – shadows deal +20% damage and move 1m further, their hits poison and draw blood."]},{"title":"SHADOW SOVEREIGN","note":"(tier 4)","paras":[],"list":["<b>2<\/b> – +2 Memory.","<b>3<\/b> – +1 shadow in the army.","<b>5<\/b> – +1 Summoning, shadows deal +25% damage and gain +20% Vitality, enemies within 5m lose resistance."]},{"title":"RELICS","note":"","paras":["Not everything lies on the shelf."],"list":["The merchants call the sets, their weapons and the tier's trinkets relics of the host: they are not sold, they are given to those who have earned them.","Level opens a tier; deeds open the relics.","The merchant will hint at what it waits for, and your journal will remember."]}]},"see":[{"href":"items.html","en":"Items and sets: every piece and bonus","ru":"Предметы и комплекты: каждая вещь и бонус"}]}]};
const T = {
  en:{eyebrow:"Shadow Sovereign · DOS2 Definitive Edition",h1:"Guide of the Silent Host",
    lede:"The four guide books every Sovereign gets in the game, on one page: binding and the host, orders, skills and breaking armour, gear and merchants.",
    toc:"Contents",first:"First steps",see:"See also",top:"Back to top",
    foot:"The text comes from the mod's guide books (version 1.5.9). The game shows the same books in your inventory and at every Shadow Merchant."},
  ru:{eyebrow:"Повелитель Теней · DOS2 Definitive Edition",h1:"Наставления Безмолвной рати",
    lede:"Четыре книги-наставления, которые каждый Повелитель получает в игре, на одной странице: пленение и войско, приказы, навыки и ломание брони, снаряжение и торговцы.",
    toc:"Содержание",first:"Первые шаги",see:"См. также",top:"Наверх",
    foot:"Текст взят из книг-наставлений мода (версия 1.5.9). Те же книги лежат в инвентаре и продаются у каждого теневого торговца."}
};
let lang="en";
try{const s=localStorage.getItem("ss_lang");if(s==="ru"||s==="en")lang=s}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// book texts keep only <b>/<i>: escape everything, then give those two back
const rich=s=>esc(s).replace(/&lt;(\/?[bi])&gt;/g,"<$1>");
function chip(l){const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=l.toUpperCase();b.setAttribute("aria-pressed",lang===l);
  b.onclick=()=>{lang=l;try{localStorage.setItem("ss_lang",l)}catch(e){}render()};return b}
const pid=(b,i)=>`${b.id}-${i+1}`;
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede;$("foot").innerHTML=`<p>${esc(t.foot)}</p>`;
  $("lang").replaceChildren(chip("en"),chip("ru"));
  $("toc").innerHTML=`<h2 id="toch">${t.toc}</h2><ol><li><a href="#first">${t.first}</a></li>${D.books.map(b=>
    `<li><a href="#${b.id}">${esc(b.title[lang])}</a><ol>${b[lang].sections.map((s,i)=>`<li><a href="#${pid(b,i)}">${esc(s.title)}</a></li>`).join("")}</ol></li>`).join("")}</ol>`;
  let html=`<section class="book" id="first"><h2>${t.first}</h2><ol class="first">${D.first.map(f=>`<li>${esc(f[lang])}</li>`).join("")}</ol></section>`;
  for(const b of D.books){const B=b[lang];
    html+=`<section class="book" id="${b.id}"><h2>${esc(b.title[lang])}</h2><p class="intro">${rich(B.intro)}</p>`+
      B.sections.map((s,i)=>`<div class="part" id="${pid(b,i)}"><h3>${esc(s.title)}${s.note?`<small>${esc(s.note)}</small>`:""}</h3>`+
        s.paras.map(p=>`<p>${rich(p)}</p>`).join("")+(s.list.length?`<ul>${s.list.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>`:"")+`</div>`).join("")+
      `<div class="see"><span class="intro" style="margin:0;align-self:center">${t.see}:</span>${b.see.map(s=>`<a href="${s.href}">${esc(s[lang])}</a>`).join("")}</div>`+
      `<a class="top" href="#top">↑ ${t.top}</a></section>`;
  }
  $("list").innerHTML=html;
}
render();
</script>
