<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadow Sovereign Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Forum&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">

<style>
/* Layout: a grimoire index – sticky filter bar over a two-column ledger of skill entries, grouped by branch */
:root{
  --bg:#120e19; --panel:#1b1525; --panel2:#231b30; --line:#3a2e4c;
  --fg:#e9e2f2; --muted:#a99cba; --gold:#d8b36a; --violet:#b57dff; --ult:#ff8f6b;
  --display:"Cinzel","Forum",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto}
header.hero{padding-block:40px 20px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance;color:var(--fg)}
.lede{color:var(--muted);max-width:65ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{font:inherit;font-size:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
button.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:700}
button.chip:focus-visible,input:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.search{flex:1 1 200px;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.lang{margin-left:auto}
section.branch{padding-top:28px}
.bhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bhead h2{font-family:var(--display);font-size:22px;margin:0;color:var(--gold);letter-spacing:.06em}
.bhead p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:14px}
article.skill{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;grid-template-columns:64px 1fr;gap:14px;min-width:0}
article.skill.ult{border-color:color-mix(in srgb,var(--ult) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--ult) 8%,var(--panel)),var(--panel) 40%)}
.icon{width:64px;height:64px;border-radius:4px;border:1px solid var(--gold);box-shadow:0 0 0 3px var(--panel2);image-rendering:auto}
.main{min-width:0;display:grid;gap:8px}
.title{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.title h3{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.03em;color:var(--fg)}
.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;padding:1px 7px;font-weight:700}
.badge.u{color:var(--bg);background:var(--ult)}
.badge.lv{color:var(--gold);border:1px solid var(--gold)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500}
.ap{display:inline-flex;gap:3px;vertical-align:-1px}
.ap i{width:10px;height:10px;border-radius:50%;background:#7fb1ff;display:inline-block}
.ap i.sp{background:var(--violet);border-radius:2px;transform:rotate(45deg) scale(.85)}
.desc{margin:0;white-space:pre-line;color:var(--fg);font-size:15px;max-width:68ch}
.note{font-size:13px;color:var(--muted);font-style:italic;margin:0}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:480px){article.skill{grid-template-columns:48px 1fr}.icon{width:48px;height:48px}}
@media (prefers-reduced-motion:no-preference){article.skill{transition:border-color .15s}article.skill:hover{border-color:var(--gold)}}
html[lang="ru"] :is(h1,h2,h3){font-synthesis:none}
</style>
<div class="wrap">
<header class="hero">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
</header>
<div class="bar" role="toolbar">
  <div class="chips" id="branches"></div>
  <input class="search" id="q" type="search" autocomplete="off">
  <div class="chips lang" id="lang"></div>
</div>
<main id="list"></main>
<footer id="foot"></footer>
</div>
<script>
const SKILLS = [{"id":"Target_SM_Arise","branch":"sovereign","ultimate":false,"name":{"ru":"Пленение тени","en":"Bind Shadow"},"desc":{"ru":"«Поднимись!» Так когда-то Даэрон сказал тени юного стражника на горящей стене – и она осталась. Вырвите тень из трупа поверженного врага. Тень встаёт рядом, сражается САМА и навсегда вступает в ваше войско. Вид тени зависит от того, кем был враг: человек станет Теневым воином, эльф – Теневым охотником, гном – Теневым стражем, ящер – Теневым чернокнижником, нежить – Теневым некромантом, порождение Пустоты – Теневым отродьем, зверь – Теневым зверем.\n\nВраг выше вас уровнем сопротивляется (−20% шанса за уровень), после трёх неудач тень рассеивается. Из сильных врагов и боссов встают элитные тени.\n\nЦель: труп врага.","en":"\"Rise!\" So Daeron once spoke to the shadow of a young guard on a burning wall – and it stayed. Tear the shadow out of a fallen enemy's corpse. It rises beside you, fights ON ITS OWN and joins your army for good. The kind of shadow depends on who the enemy was: a human becomes a Shadow Warrior, an elf a Shadow Hunter, a dwarf a Shadow Guardian, a lizard a Shadow Warlock, the undead a Shadow Necromancer, a Voidwoken a Shadow Void Spawn, a beast a Shadow Beast.\n\nAn enemy above your level resists (−20% chance per level); after three failures the shadow fades. Strong enemies and bosses rise as elite shadows.\n\nTarget: an enemy corpse."},"ap":2,"sp":0,"cooldown":2,"memory":1,"range":8,"area":null,"level":1,"damageAt":null,"icon":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAsYklEQVR4nG27d5wV1f3/fxPuzJyZ2/vM3Lm97b3bO7uwS2fpIIgIAiIIIoKInSLGEEQiggqxAEaj6IeoiRFQbLFXNHYxdiJioW69dwu8+Oacuctifr8/Xo9ZFpiZ9/O82ylj4ASX4SxZOcGlcILbwBMPlSIQ1SCJQYNZCjOZxJDBJAb1KwkZzGLEYJFiBquUMNjNBQa3tcSgOqoMAWedIeDsb9DsugL2OlfUNXhIxjvBXSZPc48MLK88L3L7lCGBawyDA1cbBqiL4jXqvHilPLOp2DulKe0dawg4+sf8jppaxVZxq9tS2uMwFbxmNcVrLVJsqd2UXGo3FUyxm1KrbaZEuUWKGogYMPCCYuCJbOCJL8YTXxNPfBwn+DiO+FIc8dKrwIleg1FwC5zgknuNtvYBcFMAlYLoGS+I const T = {

    lede:"All 29 class skills: what they do, what they cost and when the merchants start selling the book. The army fights on its own; these are the tools you give it.",

    est:"Damage shown for a hero of level %d; in game it grows with your level and attributes.",empty:"No skill matches this search.",
    foot:"Numbers come from the mod's own stats files (version 1.5.9). Shadows also keep up to 4 combat skills their enemy had in life – those are not listed here.",
    b:{sovereign:["Sovereign","Bind, call and command the host."],crusher:["The Crusher","Physical damage and broken armour."],darklord:["The Dark Lord","Marks, shrouds and the night itself."],utility:["Utility","Help from the shadows."]}},
  ru:{eyebrow:"Повелитель Теней · DOS2 Definitive Edition",h1:"Навыки Повелителя",
    lede:"Все 29 навыков класса: что делают, сколько стоят и с какого уровня торговцы продают книгу. Войско сражается само – это инструменты, которые вы ему даёте.",
    all:"Все",search:"Поиск навыка…",ultimate:"Ультимейт",level:"Книга с уровня",ap:"ОД",sp:"Исток",cd:"Перезарядка",turns:"ход.",turn:"ход",mem:"Память",range:"Дальность",area:"Область",m:"м",none:"–",

    foot:"Числа взяты из файлов статов мода (версия 1.5.9). Тени к тому же сохраняют до 4 боевых навыков своего врага – здесь они не перечислены.",
    b:{sovereign:["Повелитель","Пленить, призвать и вести войско."],crusher:["Сокрушитель","Физический урон и сломанная броня."],darklord:["Тёмный владыка","Метки, покровы и сама ночь."],utility:["Полезное","Помощь из тени."]}}

const ORDER=["sovereign","crusher","darklord","utility"];
let lang="en",branch="all",q="";
try{const s=localStorage.getItem("ss_lang");if(s==="ru"||s==="en")lang=s}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chip(label,pressed,on){const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=label;b.setAttribute("aria-pressed",pressed);b.onclick=on;return b}
function renderBar(){
  const t=T[lang];
  const br=$("branches");br.replaceChildren(chip(t.all,branch==="all",()=>{branch="all";render()}));
  ORDER.forEach(k=>br.appendChild(chip(t.b[k][0],branch===k,()=>{branch=k;render()})));
  const lg=$("lang");lg.replaceChildren(chip("EN",lang==="en",()=>setLang("en")),chip("RU",lang==="ru",()=>setLang("ru")));
  $("q").placeholder=t.search;$("q").setAttribute("aria-label",t.search);
}
function setLang(l){lang=l;try{localStorage.setItem("ss_lang",l)}catch(e){}render()}
function card(s){
  const t=T[lang];
  const ap=Array.from({length:s.ap},()=>"<i></i>").join("")+Array.from({length:s.sp},()=>'<i class="sp"></i>').join("");
  const cd=s.cooldown>0?`${s.cooldown} ${s.cooldown===1?t.turn:t.turns}`:t.none;
  const parts=[`<span>${t.ap}${s.sp?" / "+t.sp:""} <span class="ap" aria-label="${s.ap} ${t.ap}${s.sp?", "+s.sp+" "+t.sp:""}">${ap||t.none}</span></span>`,
    `<span>${t.cd} <b>${cd}</b></span>`,`<span>${t.mem} <b>${s.memory||t.none}</b></span>`];
  if(s.range)parts.push(`<span>${t.range} <b>${s.range} ${t.m}</b></span>`);
  if(s.area&&s.area>1)parts.push(`<span>${t.area} <b>${s.area} ${t.m}</b></span>`);
  return `<article class="skill${s.ultimate?" ult":""}">
    ${s.icon?`<img class="icon" src="${s.icon}" alt="" width="64" height="64">`:'<div class="icon"></div>'}
    <div class="main">
      <div class="title"><h3>${esc(s.name[lang])}</h3>${s.ultimate?`<span class="badge u">${t.ultimate}</span>`:""}<span class="badge lv">${t.level} ${s.level}</span></div>
      <div class="stats">${parts.join("")}</div>
      <p class="desc">${esc(s.desc[lang])}</p>
      ${s.damageAt?`<p class="note">${t.est.replace("%d",s.damageAt)}</p>`:""}
    </div></article>`;
}
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede;$("foot").textContent=t.foot;
  renderBar();
  const needle=q.trim().toLowerCase();
  let html="",n=0;
  ORDER.forEach(k=>{
    if(branch!=="all"&&branch!==k)return;
    const list=SKILLS.filter(s=>s.branch===k&&(!needle||(s.name.en+" "+s.name.ru+" "+s.desc[lang]).toLowerCase().includes(needle)));
    if(!list.length)return;n+=list.length;
    html+=`<section class="branch"><div class="bhead"><h2>${t.b[k][0]}</h2><p>${t.b[k][1]} · ${list.length}</p></div><div class="grid">${list.map(card).join("")}</div></section>`;
  });
  $("list").innerHTML=n?html:`<p class="empty">${t.empty}</p>`;
}
$("q").addEventListener("input",e=>{q=e.target.value;render()});
render();
</script>
