<style>
/* Layout: a chronicle – the release in progress on top, then one card per version, newest first */
:root{
  --bg:#120e19; --panel:#1b1525; --panel2:#231b30; --line:#3a2e4c;
  --fg:#e9e2f2; --muted:#a99cba; --gold:#d8b36a; --violet:#b57dff; --green:#7ad19a; --crimson:#ff8a8a; --ink:#7fb1ff;
  --display:"Cinzel","Cormorant SC",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;overflow-wrap:anywhere}
.wrap{max-width:900px;margin:0 auto}
.ssnav{max-width:900px!important}
header.hero{padding-block:28px 20px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,46px);line-height:1.1;margin:0;letter-spacing:.04em;text-wrap:balance}
.lede{color:var(--muted);max-width:64ch;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.lang{margin-left:auto}
button.chip{font:inherit;font-size:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
button.chip[aria-pressed="true"]{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.next{margin-top:22px;background:var(--panel2);border:1px dashed var(--gold);border-radius:6px;padding:14px 18px;display:grid;gap:8px}
.next h2{margin:0;font-family:var(--display);font-size:19px;color:var(--gold);letter-spacing:.05em}
.next p{margin:0;color:var(--muted)}
.meter{display:flex;gap:6px}
.meter i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--gold)}
main{display:grid;gap:14px;padding-top:22px}
article.ver{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.vh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.vh h2{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.04em}
.vh time{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.vh .latest{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--bg);background:var(--gold);border-radius:3px;padding:1px 7px}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:7px}
ul.items li{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border:1px solid;border-radius:3px;padding:2px 0;text-align:center;margin-top:2px}
.k.new{color:var(--green)}.k.change{color:var(--ink)}.k.balance{color:var(--gold)}.k.fix{color:var(--crimson)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{margin-top:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:0}
@media (max-width:480px){ul.items li{grid-template-columns:1fr;gap:3px}.k{justify-self:start;padding:1px 7px}.lang{margin-left:0}}
html[lang="ru"] :is(h1,h2,h3,.eyebrow){font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="eyebrow" id="eyebrow"></div>

</header>

  <div class="chips" id="kinds"></div>
  <div class="chips lang" id="lang"></div>
</div>

<main id="list"></main>
<footer id="foot"></footer>

<script>
const D = {"next":{"v":"1.6.0","done":0,"of":5,"items":[]},"versions":[{"v":"1.5.9","date":"2026-10-29","items":[{"k":"new","ru":"«Устав» в «Смотре войска». «Вольный» оставляет всё как прежде. «Строгий» даёт элите и теням боссов больший вес в войске, направляет вражеских боссов на Повелителя и бережёт сильные приёмы теней до Метки или «Раскола брони». Новые игры начинаются со «Строгого», старые сейвы остаются «Вольными».","en":"The Code, a switch in Muster the Army. Lenient keeps everything as before. Strict makes elites and boss shadows weigh more in the army, sends enemy bosses after the Sovereign and makes shadows save their strong moves for a target under the Sovereign's Mark or Armour Break. New games start Strict, old saves stay Lenient."},{"k":"new","ru":"Четыре книги-наставления о классе (войско, приказы, навыки, снаряжение). Каждый Повелитель получает их один раз – и в новой игре, и в старом сейве; продают их все теневые торговцы.","en":"Four guide books on the class (the host, orders, skills, gear). Every Sovereign gets them once – in a new game and in an old save – and every Shadow Merchant sells them."},{"k":"fix","ru":"Повелитель, вышедший из отряда (напарник, оставленный на «Леди Мести»), уводит теней в тень: раньше они вставали прямо на него и мешали заговорить. Войско не теряется – после возвращения в отряд «Теневое войско» зовёт его, как обычно.","en":"A Sovereign who leaves the party (a companion left aboard the Lady Vengeance) takes the shadows back into the shadow. Before, they stood right on top and blocked the conversation. The army is not lost: once back in the party, Shadow Army calls it as usual."},{"k":"fix","ru":"Тень с луком или арбалетом, поднявшись на высоту, стреляет сразу, как дошла, – выстрел больше не теряется.","en":"A shadow with a bow or crossbow that climbs to high ground shoots as soon as it gets there – the shot is no longer lost."},{"k":"fix","ru":"Тени ближнего боя реже застревают в «Держать позицию»: тень стоит на месте, только пока рядом живой враг. Навык другого мода в начале хода (например, «Boon of Chaos» из Odin's Enhanced Summon Scaling) больше не приковывает её к месту.","en":"Melee shadows get stuck in Hold position less often: a shadow holds its spot only while a living enemy is next to it. A skill another mod casts at the start of the turn (for example Boon of Chaos from Odin's Enhanced Summon Scaling) no longer pins it in place."},{"k":"fix","ru":"«Смотр войска» не открывается во время сюжетной сцены, разговора и в Зале Отголосков.","en":"Muster the Army no longer opens during a story scene or a conversation, or in the Hall of Echoes."}]},{"v":"1.5.8","date":"2026-10-25","items":[{"k":"fix","ru":"Арена Форта Радость (и всё, что снимает статусы: смерть и воскрешение, полное восстановление сюжетом) больше не забирает «Повелителя Теней», «Наследие Первого Повелителя» с дарами и Памятью, бонусы комплектов и ранги теней – они возвращаются сами. Сейв, где они уже пропали, чинится простой загрузкой.","en":"The Fort Joy arena (and anything else that strips statuses: death and resurrection, story full restores) no longer removes Shadow Sovereign, Legacy of the First Sovereign with its gifts and Memory, set bonuses or shadow ranks – they come back on their own. A save where they are already gone is fixed just by loading it."},{"k":"fix","ru":"Тени больше не кричат страхом по площади каждый ход: такие крики, взятые у врагов из других модов, тень не запоминает, а у уже пленённых они снимаются.","en":"Shadows no longer scream fear around them every turn. Some mods give enemies area fear screams and shadows copied them from their past life; such screams are no longer kept, and already bound shadows lose them."},{"k":"fix","ru":"Тени ближнего боя, уже стоящие у врага, бьют его, а не уходят к другим под удары по возможности.","en":"Melee shadows already next to an enemy stay and fight it instead of walking off and taking attacks of opportunity."},{"k":"fix","ru":"Отзыв тени больше не оставляет лужу крови или кислоты.","en":"Dismissing a shadow no longer leaves a pool of blood or acid."},{"k":"fix","ru":"Тени ближнего боя не бегают туда-сюда по склонам и лестницам и не заканчивают ход без удара: цель выбирается по настоящей длине пути, держится и в следующем ходу, а после удара тень остаётся на месте. Тени на другом уровне больше не стягиваются к Повелителю посреди боя.","en":"Melee shadows no longer run back and forth on slopes and stairs or end their turn without a blow: a shadow picks its target by the real walking distance, keeps it next turn and stays in place after its blow. Shadows on another level are no longer pulled to the Sovereign mid-fight."},{"k":"fix","ru":"У Оддо под ручным управлением на панели больше нет «выстрела посохом» писца.","en":"Oddo under your control no longer has the scribe's staff shot on the skill bar."},{"k":"fix","ru":"Тень с луком или арбалетом, поднимаясь на возвышенность, больше не теряет выстрел.","en":"A shadow with a bow or crossbow that first climbs to high ground no longer loses its shot."},{"k":"change","ru":"Реликвии рати: уведомление и журнал говорят, что откроется дальше и сколько страниц Устава нужно Оддо («Отдано Оддо: 1 из 7»).","en":"Relic sets: the notification and the journal say what opens next and how many pages of the Code Oddo needs (“Given to Oddo so far: 1 of 7”)."},{"k":"change","ru":"«Теневое войско» всегда зовёт авангард, затем сильнейших. Каждые 10 побед добавляют силу; «Смотр войска» показывает силу и победы тени.","en":"Shadow Army always calls your vanguard, then the strongest. Every 10 victories add power, and Muster the Army shows each shadow's power and victories."}]},{"v":"1.5.7","date":"2026-10-23","items":[{"k":"new","ru":"Акт 2, «Гнездо Пожирателя» на Побережье Жнеца: торговец укажет на южную оконечность берега, где последний выводок Ксар-Вохта пожирает мёртвых. Новый квест в журнале.","en":"Act 2, “The Devourer's Nest” on Reaper's Coast: the merchant points you to the southern tip of the coast, where the last brood of Xar-Vokht eats the dead. A new journal quest."},{"k":"new","ru":"Бой с Матерью выводка: яйца каждый ход выводят личинок, личинки пожирают трупы раньше, чем вы успеете их пленить, она глотает ваших павших теней, чтобы лечиться, и твердеет панцирем после сильного урона. Из её чрева говорят голоса съеденных.","en":"The Brood Mother boss fight: eggs hatch larvae every turn, larvae eat corpses before you can bind them, she swallows your fallen shadows to heal and hardens her shell after heavy damage. The voices of the eaten speak from her belly."},{"k":"new","ru":"После боя голоса гнезда просят выбрать: взять Хитиновую корону (тени лечатся за каждое убийство) или сжечь гнездо (дар в «Наследии»).","en":"After the fight the voices of the nest ask you to choose: take the Chitin Crown (your shadows heal on every kill) or burn the nest (a gift in Legacy)."},{"k":"change","ru":"2-й осколок и сир Каэл приходят только из тени Матери выводка, и её тень пленится всегда – потерять Каэла больше нельзя.","en":"The 2nd shard and Sir Kael now come from the Brood Mother's shadow, and it can always be bound – Sir Kael can no longer be lost."},{"k":"balance","ru":"Брат Корвин – настоящий босс: фонарь вспыхивает раз в ход и жжёт ближних теней, его луч бьёт и вас, магистры дерутся в полную силу (Огненный шар, Вихрь, Калечащий удар).","en":"Brother Korvin is a real boss: the lantern flares once per turn and burns nearby shadows, its beam strikes you too, and the magisters fight with zeal (Fireball, Whirlwind, Crippling Blow)."},{"k":"balance","ru":"Мать выводка на 2 уровня выше вас и бьёт и вас: хвостом вблизи, кислотой издалека. В обоих боях готовьтесь потерять немало здоровья.","en":"The Brood Mother is 2 levels above you and strikes you too: her tail up close, acid from afar. Expect to lose a good part of your health in both fights."},{"k":"change","ru":"Каждый комплект класса показывает одну иконку статуса вместо 3–4 одинаковых; в подсказке – всё, что дают надетые вещи, и следующий бонус.","en":"Each class set shows one status icon instead of 3–4 identical ones; the tooltip lists everything the worn pieces give and the next bonus."},{"k":"change","ru":"Вырванные страницы Устава объяснены в игре: журнал, новая тема у Оддо («Где искать страницы?») со счётом и уведомления «найдено N из 7».","en":"The torn pages of the Code are explained in game: the journal, a new topic with Oddo (“Where do I find the pages?”) with your count, and notifications “found N of 7”."},{"k":"change","ru":"Магистры Корвина зовутся «Магистр»; при полном войске Оддо всё равно приходит, когда лопается фонарь.","en":"Korvin's magisters are named “Magister”; with a full army Oddo still appears when the lantern bursts."},{"k":"fix","ru":"Сюжетные окна больше не открываются в бою (согласие посреди боя могло уронить игру).","en":"Story message boxes no longer open during combat (accepting one mid-fight could crash the game)."},{"k":"fix","ru":"После сожжения гнезда яйца больше не выводят существ Пустоты поздно в бою.","en":"After burning the nest its eggs no longer hatch voidlings late in the fight."}]},{"v":"1.5.6","date":"2026-10-20","items":[{"k":"new","ru":"Реликвии рати (новый квест): комплекты класса, их оружие и украшения яруса не продаются только за уровень – их нужно заслужить. Каждый комплект открывается в два шага: сначала шлем, перчатки и оружие, потом остальное. Спросите торговца: «Что ещё ты можешь мне предложить?».","en":"Relics of the host (a new quest): armour sets, their weapons and the tier's accessories are earned through the story, not bought for level alone. Each set opens in two steps: helmet, gloves and weapons first, the rest later. Ask the merchant “What else can you offer me?”."},{"k":"new","ru":"Сумеречный странник – после «Фонаря дозора» / + 2 страницы Устава. Алый рыцарь – Каэл в войске / + 4 страницы. Король роя – 3-й осколок / + 6 страниц. Повелитель Теней – 4-й осколок / все 7 страниц (и клинки Даэрона).","en":"Duskwalker: after “The Watch's Lantern” / + 2 pages of the Code. Crimson Knight: Sir Kael in the army / + 4 pages. Swarm King: the 3rd shard / + 6 pages. Shadow Sovereign: the 4th shard / all 7 pages (and Daeron's own blades)."},{"k":"new","ru":"Добыча акта 1: брат Корвин оставляет свою вещь в каждом исходе (амулет, книгу форм или посох); у магистров бывает донесение Божественного ордена; элитная тень изредка оставляет «Эхо прошлой жизни».","en":"Act 1 loot: Brother Korvin leaves a keepsake for each ending (an amulet, the book of forms or the staff); the magisters may carry a report of the Divine Order; elite shadows sometimes leave an “echo of a past life”."},{"k":"new","ru":"Брат Корвин в паузах прогулки сверяется с книгой, осматривает песок, поднимает фонарь.","en":"Between walks Brother Korvin checks the book, searches the sand and raises the lantern."},{"k":"balance","ru":"Ранги теней: ветеран – 30 побед, имя – 60 (было 15/30). Опытные тени зовутся раньше и уходят последними из полного войска.","en":"Shadow ranks: veteran at 30 victories, a name at 60 (was 15/30). Seasoned shadows are called first and are the last to leave a full army."},{"k":"change","ru":"Важные сообщения держатся дольше; сюжетные – окном, которое закрываете вы сами. Оддо стал чернильным, а не золотым.","en":"Important messages stay longer; story messages open in a window you close yourself. Oddo the Chronicler looks like ink now, not gold."},{"k":"fix","ru":"Отзыв теней больше не оставляет кровь – тень уходит, а не умирает.","en":"Recalled shadows no longer leave blood – they leave the field without dying."},{"k":"fix","ru":"В начале боя войско больше не сходится в одну точку – встаёт шеренгой лицом к врагу.","en":"At the start of a fight the army no longer walks into one spot – it forms a line facing the enemy."},{"k":"fix","ru":"На палубе «Леди Мести» больше не стоят два торговца.","en":"There are no longer two merchants on the deck of the Lady Vengeance."}]},{"v":"1.5.5","date":"2026-10-18","items":[{"k":"new","ru":"Акт 1, «Фонарь дозора»: после первой пленённой тени торговец слышит скрип пера. У Форта Радость бродит брат Корвин, последний из Сумеречного дозора, с тенью, запертой в фонаре. Расколите его броню – фонарь вспыхнет, на третий раз лопнет. Потом решите его судьбу: пощадить, пленить тень или казнить.","en":"Act 1, “The Watch's Lantern”: after your first bound shadow a merchant hears a quill scratching. On the shore by Fort Joy walks Brother Korvin, the last of the Dusk Watch, with a shadow locked in the lantern. Break the armour to make the lantern flare – the third time it bursts. Then decide Korvin's fate: spare, bind the shadow or execute."},{"k":"new","ru":"Оддо, летописец рати – новая уникальная тень, с которой можно поговорить: свои чернильные навыки, своё оружие, хроника ваших лучших теней. С ним на поле ранги растут быстрее.","en":"Oddo the Chronicler – a new unique shadow you can talk to: ink-coloured skills, a weapon of its own, a chronicle of your best shadows. With Oddo on the field shadows rank up faster."},{"k":"new","ru":"Квест «Вырванные страницы»: семь страниц Устава возвращаются, когда тени получают ранги; каждая – постоянный дар.","en":"Quest “The Torn Pages”: seven pages of the Code come back as your shadows rank up; each one is a lasting gift."},{"k":"new","ru":"Ранги теней: ветеран с 15 побед, с 30 тень вспоминает имя из прошлой жизни.","en":"Shadow ranks: veteran at 15 victories, at 30 a shadow remembers its name from its past life."},{"k":"new","ru":"Квесты мода – в настоящем журнале игры (своя категория «Повелитель Теней»). Все постоянные дары – под одной иконкой «Наследия Первого Повелителя».","en":"The mod's quests now live in the game's journal (category “Shadow Sovereign”). All lasting gifts sit under one Legacy of the First Sovereign icon."},{"k":"new","ru":"Сюжетными тенями (Каэл, Оддо) можно управлять самому: «Смотр войска» → «Управлять самому».","en":"Story shadows (Kael, Oddo) can be controlled by you: Muster the Army → “Control it yourself”."},{"k":"new","ru":"Сир Каэл Орвен приходит со 2-го акта, сначала безымянным, и вспоминает себя осколок за осколком. Изгнать его по ошибке нельзя; отпустить можно по Уставу.","en":"Sir Kael Orven now joins from act 2, nameless at first, and remembers more with every shard. Kael cannot be banished by mistake, only set free by the Code."},{"k":"balance","ru":"Больше нет 2 бесплатных мест в войске: на поле – уровень Призывания и бонусы комплектов (минимум одна тень). Урон теней −15%. Враги рядом с тенью чаще бьют её, а не героя.","en":"No more 2 free army slots: shadows on the field = your Summoning + set bonuses (at least one). Shadow damage −15%. Enemies next to a shadow are often drawn to it instead of the Sovereign."},{"k":"balance","ru":"Снаряжение класса и книги среднего яруса стоят как ванильные (снаряжение было до 40 раз дороже).","en":"Class gear and mid-tier skill books cost like vanilla now (gear was up to 40x more expensive)."},{"k":"fix","ru":"Постоянные дары с 14 уровня давали вдвое больше написанного.","en":"Lasting gifts gave twice as much as written from level 14."},{"k":"fix","ru":"Тени Безмолвных монахов (и любые «охотники» без лука) дерутся вблизи, а тени с луком или арбалетом держат дистанцию и стреляют.","en":"Shadows of the Silent Monks (and any bow-less “hunter”) now fight hand to hand; shadows holding a bow or crossbow keep their distance and shoot."},{"k":"fix","ru":"Тень в ближнем бою больше не простаивает вместо удара по ослабленному врагу; тени не целятся в тех, кого нет на сцене. Брат Корвин не вмешивается в чужие бои. Подсказки статусов не повторяют числа.","en":"A shadow held in melee no longer stands still instead of finishing a weakened enemy; shadows no longer target characters that are gone. Brother Korvin no longer joins other fights on that beach. Status tooltips no longer show numbers twice."}]},{"v":"1.5.4","date":"2026-10-17","items":[{"k":"new","ru":"Квест «Осколки Даэрона»: при пленении элитной тени может выпасть осколок памяти Первого Повелителя (по одному на акт). Торговец вплетает его в вашу тень: Память, Лидерство и Призывание +1, а за последний в войско встаёт сир Каэл Орвен, Алый рыцарь.","en":"Quest “Daeron's Shards”: binding an elite shadow may drop a memory shard of the First Sovereign (one per act). The merchant weaves it into your shadow: +1 Memory, Leadership and Summoning, and for the last one Sir Kael Orven, the Crimson Knight, joins the army."},{"k":"new","ru":"Сир Каэл – единственная алая тень и единственная, с кем можно поговорить; свои навыки: «Алый удар», «Знамя Иссара», «Ни шагу назад».","en":"Sir Kael is the only crimson shadow and the only one you can talk to, with skills of its own: Crimson Strike, Banner of Issar, Not One Step Back."},{"k":"new","ru":"История класса: Первый Повелитель Даэрон, Безмолвная рать и Раскол. Торговцы рассказывают её по актам; 7 лорных книг тоже открываются по актам.","en":"The class story: Daeron the First Sovereign, the Silent Host and the Shattering. The merchants tell it act by act; 7 lore books open act by act too."},{"k":"new","ru":"«Смотр войска»: сколько теней зовёт «Теневое войско» (для игры с полным отрядом), у каждой тени своё меню – призвать, вернуть, авангард, изгнать навсегда.","en":"Muster the Army: set how many shadows Shadow Army calls (for a full party); each shadow has its own menu – call, send back, vanguard, banish for good."},{"k":"change","ru":"Тень, зажатая врагом с «Внеочередной атакой», бьёт того, кто её держит, а не ходит туда-сюда.","en":"A shadow caught by an enemy with Attack of Opportunity fights it instead of walking back and forth."},{"k":"new","ru":"Свои рисованные иконки для сира Каэла и даров осколков.","en":"Hand-drawn icons for Sir Kael and the shard gifts."}]},{"v":"1.5.3","date":"2026-10-17","items":[{"k":"change","ru":"Тени монстров получают их родные способности (существа Пустоты, звери, пауки, тролли и другие) – проверено на 37 видах.","en":"Shadows of monsters now use their own abilities (Voidwoken, beasts, spiders, trolls and other creatures) – checked on 37 kinds."}]},{"v":"1.5.2","date":"2026-10-17","items":[{"k":"fix","ru":"В игре на любом языке, кроме русского и английского, мод был по-русски – теперь по-английски.","en":"In a game set to any language other than Russian or English the mod showed Russian – it now shows English."}]},{"v":"1.5.1","date":"2026-10-17","items":[{"k":"fix","ru":"Отзыв теней («Вернуться в тень», «Жертва тени», «Смотр войска») больше не даёт опыта.","en":"Dismissing shadows (Return to Shadow, Shadow Sacrifice, Muster the Army) no longer grants experience."},{"k":"fix","ru":"Мод в начатой игре: теневые торговцы появляются в хабах (и на «Леди Мести»), даже пока «Пленения тени» никто не знает, и продают товары по уровню героя.","en":"In a game in progress Shadow Merchants now appear in the act hubs (the Lady Vengeance too) even before anyone knows Bind Shadow, and sell goods for your level."},{"k":"fix","ru":"Тени не бьют то, по чему урон не проходит (неуязвимые цели, сферы и прочие объекты).","en":"Shadows no longer attack targets they cannot hurt (invulnerable enemies, orbs and other objects)."},{"k":"fix","ru":"Создание персонажа: вещи предпросмотра и бонусы комплекта не добавляют очков; аура не пропадает при смене пола или расы; служебные навыки не предлагаются как стартовые.","en":"Character creation: preview gear and set bonuses no longer add points; the set aura stays when you change gender or race; auto-granted skills are not offered as starting skills."},{"k":"change","ru":"Тень помнит до 4 боевых навыков врага (тень мага бросает его заклинания). Навыки теней получили по доп. эффекту: калечение, кровотечение, замедление, кислота, болезнь.","en":"A shadow keeps up to 4 combat skills its foe had in life (a mage's shadow casts its spells). Shadow skills got an extra effect each: Crippled, Bleeding, Slowed, Acid, Diseased."}]},{"v":"1.5.0","date":"2026-10-15","items":[{"k":"change","ru":"Свои рисованные иконки у всех 29 навыков Повелителя, статусов, навыков теней и книг навыков.","en":"Hand-drawn icons for all 29 Sovereign skills, the statuses, the shadow skills and the skill books."},{"k":"change","ru":"Мод стал легче на 1,6 МБ.","en":"The mod is 1.6 MB lighter."},{"k":"fix","ru":"Английский текст приказов войску называл класс старым именем.","en":"The English order descriptions used the class's old name."}]},{"v":"1.4.0","date":"2026-10-14","items":[{"k":"new","ru":"Навыки без цели («В атаку!» без теней рядом, «Теневой взрыв» без врагов и др.) пишут об этом и не тратятся: перезарядка, очки действия и исток возвращаются.","en":"Skills with nothing to hit (Attack! with no shadows near, Shadow Burst with no enemies near and others) say so and are not spent: cooldown, action points and Source come back."},{"k":"new","ru":"Мечи класса – одноручный и двуручный на каждый ярус (было 2, стало 8); «Разлом бездны» даёт навык «Раскол брони».","en":"Class swords: a one-handed and a two-handed one per tier (8 instead of 2); Rift of the Abyss grants Armour Break."},{"k":"change","ru":"«Клинок первого Повелителя» – лучший одноручный меч класса: раскалывает броню с шансом 25% и даёт «Казнь Повелителя».","en":"The Blade of the First Sovereign is the best one-handed sword of the class: a 25% chance to shatter armour and the skill Sovereign's Execution."},{"k":"fix","ru":"Имена теней и строки «Смотра войска» – на языке игры, даже если тень пленили при другом языке. В английской версии клич – “Get up!”.","en":"Shadow names and Muster the Army lines follow the game language even for shadows bound in another one. The English battle cry is “Get up!”."}]},{"v":"1.3.0","date":"2026-10-14","items":[{"k":"change","ru":"ИИ теней: почти убитых добивают простым ударом, звери первыми бросаются на магов и лекарей, тени выходят из огня и яда, раненые отходят к некроманту или Повелителю, цель Метки и «Раскола брони» – цель всего войска, охотник занимает высоту.","en":"Shadow AI: nearly dead foes get a plain blow, beasts leap at mages and healers first, shadows step out of fire and poison, the wounded fall back to a necromancer or the Sovereign, the target of the Mark and Armour Break is the whole army's target, hunters take high ground."},{"k":"change","ru":"Когда Повелитель ранен, войско бьёт напавших; в начале боя тени встают строем; потеряв половину войска, оставшиеся собираются вокруг Повелителя.","en":"When the Sovereign is wounded the army strikes the attackers; shadows form up at the start of a fight; after losing half the army the rest regroup around the Sovereign."},{"k":"fix","ru":"Статусы «Расколотая броня», «Теневая броня», «Приказ: В атаку!», «Вечная преданность» хорошо видны; «Затмение» больше не делает героя тёмным силуэтом.","en":"Shattered Armour, Shadow Armour, Command: Attack! and Eternal Devotion are now clearly visible; Eclipse no longer turns the hero into a dark silhouette."}]},{"v":"1.2.0","date":"2026-10-14","items":[{"k":"new","ru":"8 щитов класса, по два на ярус; все дают Призывание.","en":"8 class shields, two per tier; all of them give Summoning."},{"k":"new","ru":"Свой облик комплектов: с 2 вещей броня окутывается дымкой цвета комплекта, за полный комплект – аура искр и тёмного пламени.","en":"Set looks of their own: from 2 pieces the armour is wrapped in a haze of the set's colour, a full set adds an aura of sparks and dark flame."},{"k":"new","ru":"«Смотр войска» (стартовый, бесплатный, вне боя): призвать или отпустить любую тень.","en":"Muster the Army (a free starting skill, out of combat): call or release any shadow."},{"k":"new","ru":"Два ультимативных навыка с 13 уровня: «Теневой обвал» и «Затмение».","en":"Two ultimate skills from level 13: Shadow Collapse and Eclipse."},{"k":"change","ru":"Свой визуал у всех навыков класса; дерево навыков по памяти как в ванили (1, 2 и 3 ячейки).","en":"Visuals of their own for every class skill; Memory costs like vanilla (1, 2 and 3 slots)."},{"k":"change","ru":"Тени встают из портала по очереди, каждая со своим эффектом, и FPS не проседает.","en":"Shadows rise from the portal one by one, each with its own effect, without FPS drops."},{"k":"fix","ru":"Шаблон класса показан в комплекте «Сумеречный странник»; убраны визуальные огрехи эффектов, дым всех навыков фиолетовый.","en":"The class preset shows the Duskwalker set; effect glitches removed, every skill's smoke is violet."}]},{"v":"1.1.0","date":"2026-10-14","items":[{"k":"new","ru":"Навык «Приказ войску»: «Атака», «Защита», «Держать позицию».","en":"The Order the Army skill: Attack, Defend, Hold position."},{"k":"new","ru":"Пока Повелитель в скрытности, войско тоже невидимо.","en":"While the Sovereign is sneaking, the army is hidden too."},{"k":"change","ru":"ИИ теней: стрелки отходят от врагов, стражи и рыцари закрывают Повелителя, войско добивает цель Повелителя, чернокнижник первым ломает её броню.","en":"Shadow AI: ranged shadows step away from foes, guardians and knights cover the Sovereign, the army finishes the Sovereign's target, the warlock breaks its armour first."},{"k":"fix","ru":"Тени из старых версий получают свой тип; массовый призыв больше не роняет FPS.","en":"Shadows from old versions get their kind; calling many shadows no longer drops FPS."}]},{"v":"1.0.0","date":"2026-10-14","items":[{"k":"new","ru":"Английский язык: навыки, статусы, вещи, книги, диалог торговца.","en":"English: skills, statuses, items, books, the merchant dialogue."},{"k":"change","ru":"Мод и класс называются «Повелитель Теней» (Shadow Sovereign), файл – ShadowSovereign.pak; старый .pak удалите.","en":"The mod and the class are now called Shadow Sovereign, the file is ShadowSovereign.pak; delete the old .pak."},{"k":"new","ru":"Теневые торговцы в хабах актов и навык «Зов теневого торговца»; товары класса открываются по уровню Повелителя (1, 4, 9, 13).","en":"Shadow Merchants in the act hubs and the skill Call the Shadow Merchant; class goods open by the Sovereign's level (1, 4, 9, 13)."},{"k":"new","ru":"4 комплекта брони по 5 частей с бонусами за 2/3/5 вещей; новое оружие и украшения – всего 42 вещи класса.","en":"4 armour sets of 5 pieces with bonuses for 2/3/5 worn; new weapons and accessories – 42 class items in all."},{"k":"new","ru":"«Вернуться в тень»; пленение из любого трупа, кроме героев отряда; тактический ИИ теней; свой профиль брони у каждого типа тени; свои эффекты навыков.","en":"Return to Shadow; binding from any corpse except party heroes; tactical shadow AI; each kind of shadow has its own armour; the class's own skill effects."},{"k":"fix","ru":"Войско восстанавливается целиком после перехода между картами; тени мирных NPC сражаются; тени усиливаются с ростом уровня; вещи класса не требуют Интеллекта; бой не зависает из-за следования теней.","en":"The army comes back whole after a map change; shadows of peaceful NPCs fight; shadows grow with your level; class items no longer require Intelligence; fights no longer hang on shadows following."}]},{"v":"0.3.0","date":"2026-10-14","items":[{"k":"change","ru":"Класс стал чистым призывателем; 23 навыка в трёх ветках и «Расколотая броня»; 7 типов теней со своими навыками, элитные тени из сильных врагов; тени сражаются сами; 13 вещей призывателя.","en":"The class became a pure summoner; 23 skills in three branches and Shattered Armour; 7 kinds of shadows with their own skills, elite shadows from strong foes; shadows fight on their own; 13 summoner items."}]},{"v":"0.2.0","date":"2026-10-13","items":[{"k":"new","ru":"Теневое войско сохраняется в сейве; товары класса у торговцев каждого акта.","en":"The shadow army is kept in the save; class goods at merchants in every act."}]},{"v":"0.1.0","date":"2026-10-13","items":[{"k":"new","ru":"Первая версия: класс «Повелитель Теней», 9 навыков, пленение теней.","en":"First version: the Shadow Sovereign class, 9 skills, binding shadows."}]}]};
const T = {
  en:{eyebrow:"Shadow Sovereign · DOS2 Definitive Edition",h1:"Chronicle of Versions",
    lede:"What changed in each version of the mod, newest first.",
    kinds:{all:"All",new:"New",change:"Changed",balance:"Balance",fix:"Fixed"},
    next:v=>`In the works: ${v}`,
    ready:(n,m)=>`${n} of ${m} changes ready. A new version comes out when ${m} are done.`,
    none:"Nothing ready yet – watch for news on Nexus.",latest:"latest",empty:"No changes of this kind.",
    foot:"Full logs for every file are also on the Nexus page of the mod (Logs tab)."},
  ru:{eyebrow:"Повелитель Теней · DOS2 Definitive Edition",h1:"Летопись версий",
    lede:"Что менялось в каждой версии мода, сначала новые.",
    kinds:{all:"Все",new:"Новое",change:"Изменено",balance:"Баланс",fix:"Исправлено"},
    next:v=>`В работе: ${v}`,
    ready:(n,m)=>`Готово изменений: ${n} из ${m}. Новая версия выходит, когда готовы все ${m}.`,
    none:"Пока ничего не готово – следите за новостями на Nexus.",latest:"последняя",empty:"Изменений такого вида нет.",
    foot:"Полные списки изменений к каждому файлу есть и на странице мода на Nexus (вкладка Logs)."}
};
let lang="en",kind="all";
try{const s=localStorage.getItem("ss_lang");if(s==="ru"||s==="en")lang=s}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chip(label,pressed,on){const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=label;b.setAttribute("aria-pressed",pressed);b.onclick=on;return b}
function setLang(l){lang=l;try{localStorage.setItem("ss_lang",l)}catch(e){}render()}
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $("eyebrow").textContent=t.eyebrow;$("h1").textContent=t.h1;$("lede").textContent=t.lede;$("foot").innerHTML=`<p>${esc(t.foot)}</p>`;
  $("kinds").replaceChildren(...Object.keys(t.kinds).map(k=>chip(t.kinds[k],kind===k,()=>{kind=k;render()})));
  $("lang").replaceChildren(chip("EN",lang==="en",()=>setLang("en")),chip("RU",lang==="ru",()=>setLang("ru")));
  const n=D.next;
  $("next").hidden=!n;
  if(n)$("next").innerHTML=`<h2 id="nexth">${esc(t.next(n.v))}</h2><div class="meter" role="img" aria-label="${n.done} / ${n.of}">${Array.from({length:n.of},(_,i)=>`<i${i<n.done?' class="on"':""}></i>`).join("")}</div><p>${esc(n.done?t.ready(n.done,n.of):t.none)}</p>`+
    ((n.items||[]).length?`<ul class="items">${n.items.map(it=>`<li><span class="k ${it.k}">${t.kinds[it.k]}</span><span>${esc(it[lang])}</span></li>`).join("")}</ul>`:"");
  const html=D.versions.map((v,i)=>{const items=v.items.filter(it=>kind==="all"||it.k===kind);if(!items.length)return "";
    return `<article class="ver" id="v${v.v}"><div class="vh"><h2>${esc(v.v)}</h2>${v.date?`<time datetime="${v.date}">${v.date}</time>`:""}${i===0?`<span class="latest">${t.latest}</span>`:""}</div>`+
      `<ul class="items">${items.map(it=>`<li><span class="k ${it.k}">${t.kinds[it.k]}</span><span>${esc(it[lang])}</span></li>`).join("")}</ul></article>`}).join("");
  $("list").innerHTML=html||`<p class="empty">${t.empty}</p>`;
}
render();
</script>
</body>
</html>
